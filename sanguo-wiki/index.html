<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三国演义知识图谱</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #334155;flex-shrink:0;flex-wrap:wrap}
#topbar h1{font-size:18px;font-weight:700;color:#f8fafc;white-space:nowrap}
#search{flex:1;max-width:280px;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 10px;color:#e2e8f0;font-size:14px;outline:none}
#search:focus{border-color:#6366f1}
.tab-btn{padding:5px 12px;border-radius:5px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-size:13px}
.tab-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
#legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:12px;color:#94a3b8}
.legend-dot{width:10px;height:10px;border-radius:50%}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:240px;background:#1e293b;border-right:1px solid #334155;display:flex;flex-direction:column;flex-shrink:0}
#sidebar-tabs{display:flex;border-bottom:1px solid #334155;flex-shrink:0}
.side-tab{flex:1;padding:7px 4px;font-size:12px;text-align:center;cursor:pointer;color:#64748b;border:none;background:none}
.side-tab.active{color:#e2e8f0;border-bottom:2px solid #6366f1}
#list-container{flex:1;overflow-y:auto;padding:8px}
#list-container::-webkit-scrollbar{width:4px}
#list-container::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.list-item{padding:7px 10px;border-radius:5px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:2px;transition:background .15s}
.list-item:hover{background:#334155}
.list-item.selected{background:#312e81}
.list-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.list-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-sub{font-size:11px;color:#64748b;white-space:nowrap}
#graph-area{flex:1;position:relative;overflow:hidden}
#graph-svg{width:100%;height:100%}
#wiki{width:380px;background:#1e293b;border-left:1px solid #334155;overflow-y:auto;flex-shrink:0;display:none}
#wiki::-webkit-scrollbar{width:4px}
#wiki::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
#wiki-content{padding:20px}
#wiki-close{position:sticky;top:0;background:#1e293b;padding:10px 16px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;cursor:pointer;z-index:10}
#wiki-close:hover{background:#334155}
.wiki-title{font-size:20px;font-weight:700;margin-bottom:4px}
.wiki-meta{font-size:12px;color:#64748b;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wiki-tag{padding:2px 7px;border-radius:10px;font-size:11px}
.wiki-section{margin-top:14px}
.wiki-section h3{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #334155}
.wiki-bio{font-size:14px;line-height:1.8;color:#cbd5e1}
.wiki-timeline{list-style:none}
.wiki-timeline li{padding:8px 0;border-bottom:1px solid #1e3a5f;display:flex;gap:10px;font-size:13px}
.tl-year{color:#fbbf24;font-weight:600;min-width:60px;flex-shrink:0}
.tl-desc{color:#cbd5e1;line-height:1.6}
a.wiki-link{color:#818cf8;text-decoration:none;border-bottom:1px dotted #818cf8;cursor:pointer}
a.wiki-link:hover{color:#a5b4fc}
.rel-grid{display:flex;flex-direction:column;gap:6px}
.rel-item{background:#0f172a;border-radius:6px;padding:8px 10px;font-size:13px}
.rel-name{color:#818cf8;font-weight:600;cursor:pointer}
.rel-name:hover{color:#a5b4fc;text-decoration:underline}
.rel-type{font-size:11px;color:#f97316;margin-left:6px}
.rel-desc{color:#94a3b8;font-size:12px;margin-top:2px;line-height:1.5}
.participant-list{display:flex;flex-wrap:wrap;gap:6px}
.ptag{background:#0f172a;border-radius:4px;padding:4px 8px;font-size:12px;color:#818cf8;cursor:pointer}
.ptag:hover{color:#a5b4fc;text-decoration:underline}
.loc-event-list{display:flex;flex-direction:column;gap:6px}
.loc-event-item{background:#0f172a;border-radius:6px;padding:8px 10px;font-size:13px}
.loc-event-year{color:#fbbf24;font-size:11px;margin-bottom:2px}
.tooltip{position:absolute;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:8px 12px;pointer-events:none;font-size:13px;color:#e2e8f0;max-width:200px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.node-circle{cursor:pointer}
.node-circle:hover{filter:brightness(1.3)}
.node-label{pointer-events:none;font-size:10px;fill:#e2e8f0;text-anchor:middle}
.link-line{stroke-opacity:.4}

/* ── Mobile ── */
#mob-bar{display:none}
@media(max-width:768px){
  #topbar{padding:8px 12px;gap:8px;flex-wrap:wrap}
  #topbar h1{font-size:15px}
  #search{max-width:none;flex:1;font-size:13px}
  .tab-btn{padding:4px 9px;font-size:12px}
  #legend{display:none}
  #sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:300;
    transform:translateX(-100%);transition:transform .25s ease;
    width:260px;
  }
  #sidebar.open{transform:translateX(0)}
  #mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:299}
  #mob-overlay.open{display:block}
  #graph-area{width:100%}
  #wiki{
    position:fixed!important;bottom:0;left:0;right:0;
    width:100%!important;height:72vh;display:none;
    border-left:none;border-top:1px solid #334155;
    border-radius:16px 16px 0 0;z-index:400;
    flex-direction:column;
  }
  #wiki.mob-open{display:flex!important}
  #wiki-close{border-radius:16px 16px 0 0;justify-content:space-between}
  #mob-bar{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:#1e293b;border-top:1px solid #334155;
    padding:6px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));
    gap:8px;z-index:200;align-items:center;
  }
  #mob-list-btn{
    padding:7px 12px;background:#0f172a;border:1px solid #334155;
    border-radius:8px;color:#e2e8f0;font-size:13px;cursor:pointer;
    white-space:nowrap;flex-shrink:0;
  }
  #mob-faction-row{
    display:flex;gap:6px;overflow-x:auto;flex:1;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  #mob-faction-row::-webkit-scrollbar{display:none}
  .mob-btn,.mob-tab-btn{
    flex-shrink:0;padding:6px 11px;border-radius:16px;
    border:1px solid #334155;background:transparent;
    color:#94a3b8;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .mob-btn.active,.mob-tab-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
  #mob-wiki-restore-btn{background:#431407;border-color:#f97316;color:#fb923c}
  body{height:100dvh}
  #main{padding-bottom:0}
  .wiki-title{font-size:17px}
  .wiki-bio,.tl-desc,.rel-desc{font-size:13px}
  .wiki-timeline li{font-size:12px}
  .list-item{padding:9px 10px}
}

/* ── Map + Timeline ─────────────────────────────────────────── */
#map-view{display:none;flex-direction:column;position:absolute;inset:0;overflow:hidden;z-index:1}
#map-view.map-on{display:flex}
#map-wrap{flex:1;overflow:hidden;background:#0c1a2e;position:relative}
#map-svg{position:absolute;inset:0;width:100%;height:100%}
/* Timeline bar */
#tl-bar{
  flex-shrink:0;height:78px;background:#111a27;border-bottom:1px solid #1e293b;
  position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;
}
#tl-rail{position:absolute;left:48px;right:48px;top:37px;height:3px;background:#1e293b;border-radius:2px;cursor:pointer}
#tl-prog{position:absolute;left:0;top:0;height:3px;background:#4f46e5;border-radius:2px;transition:width .12s;pointer-events:none}
#tl-thumb{
  position:absolute;top:29px;width:18px;height:18px;border-radius:50%;
  background:#6366f1;border:2px solid #a5b4fc;cursor:ew-resize;
  transform:translateX(-50%);z-index:10;box-shadow:0 0 8px #6366f160;
}
.tl-dot{
  position:absolute;top:31px;width:12px;height:12px;border-radius:50%;
  border:2px solid;background:#0c1a2e;transform:translateX(-50%);
  cursor:pointer;z-index:4;transition:transform .12s,opacity .15s;
}
.tl-dot:hover{transform:translateX(-50%) scale(1.4)!important}
.tl-dot.ev-fut{border-color:#334155;opacity:.2}
.tl-dot.ev-past{border-color:#475569;background:#475569;opacity:.45}
.tl-dot.ev-cur{border-color:#f97316;background:#0c1a2e;transform:translateX(-50%) scale(1.6)!important;box-shadow:0 0 8px #f97316;z-index:8;opacity:1}
.tl-lbl{
  position:absolute;top:49px;font-size:9px;transform:translateX(-50%);
  white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;pointer-events:auto;
}
.tl-lbl.ev-fut{display:none}
.tl-lbl.ev-past{display:none}
.tl-lbl.ev-cur{color:#fb923c;font-weight:700;max-width:70px;font-size:9.5px}
.tl-yr{position:absolute;top:17px;font-size:9px;color:#334155;transform:translateX(-50%);pointer-events:none}
/* map event markers */
.mev-ring{fill:none;stroke-width:2;transition:opacity .18s}
.mev-ring.ev-fut{opacity:0;pointer-events:none}
.mev-ring.ev-past{stroke:#475569;opacity:.5}
.mev-ring.ev-cur{stroke:#f97316;opacity:1;animation:mpulse 1.5s ease-in-out infinite}
.mev-dot{transition:fill .18s,opacity .18s}
.mev-dot.ev-fut{opacity:0;pointer-events:none}
.mev-dot.ev-past{fill:#475569;opacity:.6}
.mev-dot.ev-cur{fill:#f97316;opacity:1}
.mev-hit{fill:transparent;cursor:pointer}
@keyframes mpulse{0%,100%{r:9}50%{r:13}}
/* hide faction tabs in map mode */
body.map-mode .tab-btn{display:none}
body.map-mode #legend{display:none!important}
body.map-mode #mob-faction-row{display:none}


/* ── Leaflet dark theme ── */
.leaflet-container{background:#0c1a2e!important;font-family:inherit}
.leaflet-tile-pane{opacity:1}
.leaflet-control-attribution{
  background:rgba(15,23,42,.75)!important;
  color:#475569!important;font-size:10px;border-radius:4px 0 0 0!important;
}
.leaflet-control-attribution a{color:#6366f1!important}
.leaflet-control-zoom a{
  background:#1e293b!important;color:#e2e8f0!important;
  border-color:#334155!important;
}
.leaflet-control-zoom a:hover{background:#334155!important}
.map-tip{
  background:#1e293b!important;border:1px solid #334155!important;
  border-radius:5px!important;color:#e2e8f0!important;
  font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.5)!important;
  padding:4px 10px!important;white-space:nowrap;
}
.leaflet-tooltip-top.map-tip::before{border-top-color:#334155!important}
.leaflet-tooltip-right.map-tip::before{border-right-color:#334155!important}


.map-tip-loc{
  background:#1e293b!important;border:1px solid #f97316!important;
  border-radius:4px!important;color:#fb923c!important;
  font-size:12px;font-weight:600;padding:3px 8px!important;
  pointer-events:none;box-shadow:0 2px 8px rgba(249,115,22,.3)!important;
}
.map-tip-loc::before{border-top-color:#f97316!important}


/* Graph reset button */
#graph-reset-btn{
  position:absolute;top:8px;right:8px;z-index:10;
  background:#1e293b;border:1px solid #334155;border-radius:8px;
  color:#94a3b8;font-size:13px;padding:5px 10px;cursor:pointer;line-height:1;
}
#graph-reset-btn:hover{background:#334155;color:#e2e8f0}
body.map-mode #graph-reset-btn{display:none}

/* Event prev/next nav */
#evt-nav{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:20px;padding-top:12px;border-top:1px solid #1e3a5f;gap:8px;
}
.evt-nav-btn{
  flex:1;padding:8px 10px;background:#0f172a;border:1px solid #334155;
  border-radius:8px;color:#818cf8;font-size:12px;cursor:pointer;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s,border-color .15s;
}
.evt-nav-btn:hover{background:#1e293b;border-color:#6366f1;color:#a5b4fc}
.evt-nav-btn.prev::before{content:"← "}
.evt-nav-btn.next::after{content:" →"}

/* Wiki minimize */
#wiki.wiki-min #wiki-content{display:none}
#wiki.wiki-min{overflow:hidden}
#wiki-minimize-btn{transition:transform .2s}
#wiki.wiki-min #wiki-minimize-btn{transform:rotate(180deg)}
/* Desktop: minimized wiki collapses to just the header bar */
@media(min-width:769px){
  #wiki.wiki-min{width:44px;overflow:hidden}
  #wiki.wiki-min #wiki-close{flex-direction:column;gap:8px;padding:10px 6px;align-items:center}
  #wiki.wiki-min #wiki-close span{display:none}
}
/* Mobile: minimized wiki slides down out of view */
@media(max-width:768px){
  #wiki.wiki-min{transform:translateY(100%);transition:transform .25s ease}
  #wiki:not(.wiki-min){transition:transform .25s ease}
}

</style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
<div id="topbar">
  <h1>⚔ 三国演义知识图谱</h1>
  <input id="search" type="text" placeholder="搜索人物、事件、地点…">
  <button class="tab-btn active" onclick="filterFaction('all')">全部</button>
  <button class="tab-btn" onclick="filterFaction('蜀汉')">蜀汉</button>
  <button class="tab-btn" onclick="filterFaction('曹魏')">曹魏</button>
  <button class="tab-btn" onclick="filterFaction('东吴')">东吴</button>
  <button class="tab-btn" onclick="filterFaction('其他')">其他</button>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>蜀汉</div>
    <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>曹魏</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div>东吴</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>其他/汉室</div>
  </div>
</div>
<div id="main">
  <div id="sidebar">
    <div id="sidebar-tabs">
      <button class="side-tab active" onclick="setSideTab('character')">人物</button>
      <button class="side-tab" onclick="setSideTab('event')">事件</button>
    </div>
    <div id="list-container"></div>
  </div>
  <div id="graph-area">
    <svg id="graph-svg"></svg>
    <button id="graph-reset-btn" onclick="resetGraph()" title="重置视图">⌖ 重置</button>
    <div id="map-view">
      <div id="tl-bar">
        <div id="tl-rail"><div id="tl-prog"></div></div>
        <div id="tl-thumb"></div>
      </div>
      <div id="map-wrap">
      </div>
    </div>
    <div class="tooltip" id="tooltip" style="display:none"></div>
  </div>
  <div id="wiki">
    <div id="wiki-close">
      <span style="font-size:14px;color:#94a3b8;cursor:pointer" onclick="closeWiki()">← 返回列表</span>
      <button id="wiki-minimize-btn" onclick="toggleWikiMin()" title="收起详情"
        style="background:none;border:1px solid #334155;border-radius:6px;
               color:#94a3b8;font-size:16px;padding:2px 8px;cursor:pointer;
               line-height:1;flex-shrink:0">⌄</button>
    </div>
    <div id="wiki-content"></div>
  </div>
</div>

<script>
const RAW = {"nodes":[{"id":"liubei","name":"刘备","type":"character","faction":"蜀汉","title":"蜀汉昭烈帝","born":"161年","died":"223年","bio":"字玄德，涿郡涿县人，自称汉景帝玄孙，以仁义著称。早年织席贩履，家境贫寒，却心怀大志。桃园结义后聚义兵，先后依附公孙瓒、陶谦、曹操、袁绍、刘表，屡战屡败却屡败屡起，世称刘皇叔。三顾茅庐得诸葛亮后方有战略方向，赤壁之战后奠定荆益根基。「仁德」是其最大政治资本——携民渡江、义释刘璋，皆是收买人心之举。然夷陵之战因私怨伐吴，白帝城含恨而终，一生大业功亏一篑。","timeline":[{"year":"184年","event_id":"taoyuan","location_id":"zhuo","desc":"黄巾起义爆发，刘备在涿郡与关羽、张飞桃园结义，共同举义兵。三人情同手足，誓共生死。"},{"year":"194年","event_id":"","location_id":"xuzhou","desc":"徐州牧陶谦病危以徐州相让，刘备三辞而受，得到徐州根据地，但随即遭吕布偷袭失去徐州。"},{"year":"198年","event_id":"baimen","location_id":"xiapi","desc":"联合曹操围攻下邳擒吕布。吕布被缚后苦苦哀求，曹操有意留用，刘备进言：公不见丁原、董卓之事乎？曹操遂下令处死吕布。此举是刘备政治现实主义的典型体现——吕布曾多次收留自己，却在关键时刻反手推一把。"},{"year":"200年","event_id":"zhujiu","location_id":"xu","desc":"依附曹操期间，被曹操视为英雄对手。煮酒论英雄时，曹操直言天下英雄唯你我二人，刘备故意在雷声时失箸掩饰惊慌，以示无大志。"},{"year":"200年","event_id":"yidaizao","location_id":"xu","desc":"参与衣带诏密谋，事泄后出走徐州，举兵反曹，从此与曹操彻底决裂。"},{"year":"207年","event_id":"sangumaolu","location_id":"longzhong","desc":"三顾茅庐，诚心感动诸葛亮出山。隆中对为其规划三分天下战略，刘备如鱼得水，自此有了明确方向。"},{"year":"208年","event_id":"changban","location_id":"dangyang","desc":"曹操大军南下，刘备携十余万百姓南逃，宁可放慢速度也不抛弃百姓，此举大得民心，赵云长坂坡单骑救出幼子阿斗。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"联吴抗曹，赤壁大胜，趁势夺取荆州南四郡，终于有了稳固根基。"},{"year":"214年","event_id":"ruichuan","location_id":"chengdu","desc":"入主益州，刘璋投降。法正、庞统功不可没，但庞统落凤坡牺牲是巨大损失。"},{"year":"219年","event_id":"hanzhong","location_id":"loc_hanzhong","desc":"汉中大战胜利，自称汉中王，与曹操南北对峙，蜀汉达到鼎盛。"},{"year":"221年","event_id":"yiling","location_id":"loc_yiling","desc":"关羽死后不顾诸葛亮、赵云劝阻坚持伐吴，夷陵惨败，七十万大军几乎全灭。"},{"year":"223年","event_id":"baidi","location_id":"loc_baidi","desc":"退守白帝城，病危托孤诸葛亮：君才十倍曹丕，若嗣子可辅辅之，如其不才，君可自取。含恨病逝，终年63岁。"}],"relations":[{"target_id":"guanyu","rel":"义兄弟","desc":"关羽死后刘备不顾大局执意伐吴，情义与政治判断之间他选择了前者，最终葬送了蜀汉的战略机遇。"},{"target_id":"zhangfei","rel":"义兄弟","desc":"三人中张飞最为直率忠心，刘备每遇危难必有张飞断后。"},{"target_id":"zhugeliang","rel":"君臣知己","desc":"三顾茅庐的知遇之恩让诸葛亮终身报效。白帝城托孤是刘备最后的政治手腕，真情还是权谋，后世争议不休。"},{"target_id":"zhaoyun","rel":"君臣","desc":"长坂坡赵云七进七出救出阿斗，刘备接到阿斗后摔于地曰：为此孺子，险折我一员大将！此举令赵云感激涕零。"},{"target_id":"lyubu","rel":"曾被庇护/后落井下石","desc":"吕布曾两次收留刘备，刘备却在下邳城外一句话送走了吕布，显示其政治现实主义的一面。"},{"target_id":"caocao","rel":"政敌/相互欣赏","desc":"两人是三国最具戏剧性的对手。曹操欣赏刘备才能，煮酒论英雄道出了双方的相互认知。"},{"target_id":"liuchan","rel":"父子","desc":"白帝城托孤既是真情流露，也暗含对诸葛亮的政治压力——若诸葛亮敢取而代之则大义尽失。"}]},{"id":"guanyu","name":"关羽","type":"character","faction":"蜀汉","title":"前将军·汉寿亭侯·武圣","born":"160年","died":"219年","bio":"字云长，河东解良人，因杀人逃亡在外，遇刘备后桃园结义。使青龙偃月刀骑赤兔马，以忠义著称，后世尊为武圣关帝。性格傲慢，素来瞧不起士大夫，却对底层兵士极好。曾降曹操，过五关斩六将回归刘备成就忠义美名。水淹七军威震华夏达到巅峰，却因骄傲轻敌加上盟友背叛，走麦城身死，使蜀汉失去荆州这一战略要地，是三国历史最重要的转折点之一。","timeline":[{"year":"184年","event_id":"taoyuan","location_id":"zhuo","desc":"桃园结义，与刘备张飞结为异姓兄弟，共同起兵。"},{"year":"200年","event_id":"guandu","location_id":"loc_guandu","desc":"曹操下邳大破刘备，关羽被困土山。约三事降汉：一、降汉不降曹；二、奉养二位嫂嫂；三、一旦得知刘备消息立即离去。曹操爱其才，赠赤兔马、封汉寿亭侯，关羽以斩颜良、诛文丑报答曹操厚恩。"},{"year":"200年","event_id":"guowuguan","location_id":"xu","desc":"得知刘备在袁绍处，辞别曹操北上。曹操明知其要走，令沿路放行。关羽千里走单骑，过五关（东岭关、洛阳、沂水关、荥阳、滑州）斩六将，护送二位嫂嫂回归刘备。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"赤壁之战后华容道奉命拦截曹操，念旧恩义释曹操。事后诸葛亮要按军令状处斩，刘备以留曹操制衡孙权为由求情，关羽得以保全。"},{"year":"209年","event_id":"","location_id":"jingzhou","desc":"镇守荆州。孙权为子求娶其女，关羽斥曰：虎女焉能嫁犬子！此语极大激怒孙权，成为吴蜀关系破裂的重要节点。"},{"year":"219年","event_id":"shuiqishu","location_id":"fancheng","desc":"刮骨疗毒展示过人胆气。随后发动北伐，水淹七军，擒于禁、斩庞德，威震华夏，曹操一度议迁许都以避其锋。"},{"year":"219年","event_id":"maicheng","location_id":"loc_maicheng","desc":"吕蒙白衣渡江偷袭荆州，后方尽失。关羽前后受敌，粮绝援断，退守麦城。突围途中父子被潘璋部将马忠所擒，孙权斩其首级。曹操以诸侯之礼厚葬其首级于洛阳，孙权将其身躯以诸侯礼葬于当阳。"}],"relations":[{"target_id":"liubei","rel":"义弟","desc":"对刘备忠心耿耿，但其骄傲导致荆州失守，间接造成刘备夷陵惨败，是蜀汉最大的战略失误。"},{"target_id":"zhangfei","rel":"义弟","desc":"两人情若手足，常并称关张。关羽更为骄傲，张飞粗中有细，两人性格互补。"},{"target_id":"caocao","rel":"复杂恩义","desc":"土山降汉不降曹，曹操礼遇有加，关羽以斩颜良文丑相报，华容道又义释，两人之间有难以言说的恩义关系。"},{"target_id":"lyumeng","rel":"宿敌","desc":"吕蒙一直视夺荆州为己任，佯装染病麻痹关羽，白衣渡江创造奇袭，是关羽最大的克星。"},{"target_id":"sunquan","rel":"决裂","desc":"拒绝孙权联姻一句虎女焉能嫁犬子，彻底葬送了孙刘联盟在荆州的基础。"},{"target_id":"pongde","rel":"对手","desc":"庞德抬棺上阵誓死不降，水淹七军后宁死不屈被斩，与投降的于禁形成鲜明对比，关羽对庞德之勇深为敬佩。"}]},{"id":"zhangfei","name":"张飞","type":"character","faction":"蜀汉","title":"车骑将军","born":"167年","died":"221年","bio":"字益德（一作翼德），涿郡人，以卖酒屠猪为业。与刘备、关羽桃园结义，以猛勇著称，声如洪雷，万人难当。常被视为莽夫，实则粗中有细：义释严颜展示了他知人善任的一面，智取瓦口隘大败张郃证明其军事才华。其最大缺点是嗜酒和鞭打士卒，刘备曾多次提醒此事必招祸，最终死于部将之手，一语成谶。","timeline":[{"year":"184年","event_id":"taoyuan","location_id":"zhuo","desc":"桃园结义，张飞出资提供军饷，是早期刘备集团最重要的财力支持者之一。"},{"year":"208年","event_id":"changban","location_id":"dangyang","desc":"当阳桥头，身后仅数十骑，面对曹操数万追兵，单人独骑横矛立马，连呼三声：燕人张翼德在此，谁敢来决死！声若惊雷，曹操诸将面面相觑无人敢上，曹军退走。"},{"year":"214年","event_id":"yidaijianzhang","location_id":"chengdu","desc":"入川时生擒严颜，严颜宁死不降。张飞被其气节感动，亲自松绑以礼相待：老将军休怒，我失礼了。严颜感激遂归降，沿途城池望风而降，张飞因此少费许多兵力。"},{"year":"219年","event_id":"hanzhong","location_id":"loc_hanzhong","desc":"宕渠之战张飞以少胜多，在山地设伏大败张郃，是其最重要的独立作战胜利，证明其绝非有勇无谋之人。"},{"year":"221年","event_id":"","location_id":"langzhong","desc":"得知关羽被杀后悲痛万分，强令部将范疆张达三日内备齐白盔白甲，对两人拳打脚踢。二人惧怕夜间入帐刺杀张飞，割下首级投奔东吴，张飞死时年约55岁。刘备闻报叹曰：噫，飞死矣。"}],"relations":[{"target_id":"liubei","rel":"义兄弟","desc":"对刘备忠心最为纯粹，从不质疑，是刘备最可靠的屏障。"},{"target_id":"guanyu","rel":"义兄弟","desc":"情同骨肉，关羽死后张飞悲痛失控，以致送命。"},{"target_id":"yanyan","rel":"对手/归降","desc":"义释严颜是张飞形象最具深度的时刻，展示了粗中有细的一面。"},{"target_id":"zhanghe","rel":"军事对手","desc":"宕渠之战张飞以机动山地战大败张郃，是两人最著名的对决。"}]},{"id":"zhugeliang","name":"诸葛亮","type":"character","faction":"蜀汉","title":"丞相·武乡侯","born":"181年","died":"234年","bio":"字孔明，号卧龙，琅琊阳都人，幼年丧父，随叔父流寓荆州，隐居隆中。博览群书，上知天文下知地理，自比管仲乐毅。三分天下战略的总设计师，赤壁之战的关键推手，蜀汉政权的实际建构者。刘备死后独力支撑蜀汉，六出祁山北伐中原，鞠躬尽瘁死而后已，成为中国历史上忠臣智者的最高象征。其治蜀之功远超军事：整顿吏治、发展农业、法度严明，将弱小蜀汉维持运转数十年。","timeline":[{"year":"207年","event_id":"sangumaolu","location_id":"longzhong","desc":"刘备三顾茅庐，诸葛亮提出隆中对：联吴抗曹、占荆益、待天下有变则两路出兵。出山时年仅27岁，此为三分天下总纲。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"舌战群儒说服孙权联合抗曹；借东风使黄盖火攻成功；事先料定关羽必放曹操，让其立军令状，为华容道事件留下伏笔。赤壁之战是诸葛亮的成名之战。"},{"year":"214年","event_id":"ruichuan","location_id":"chengdu","desc":"留守荆州时把蜀地治理得井井有条，法度严明赏罚分明。入主益州后继续主持内政，连对手司马懿也称其天下奇才。"},{"year":"223年","event_id":"baidi","location_id":"loc_baidi","desc":"刘备托孤，诸葛亮泪流满面跪伏于地，誓死效忠。此后以丞相身份总揽蜀汉军政二十年，实际上是无冕之王。"},{"year":"225年","event_id":"qinmeng","location_id":"nanzhong","desc":"七擒孟获，每次擒住都当众释放令其折服。第七次孟获跪地：南人不复反矣。诸葛亮随即撤军，此后南中再无大乱。"},{"year":"227年","event_id":"","location_id":"loc_hanzhong","desc":"出师表泣涕横流，陈述先帝知遇之恩，表明北伐决心。此文情真意切，被誉为千古第一表，至今令人动容。"},{"year":"228年","event_id":"jietingzhan","location_id":"jietin","desc":"首次北伐，战略上大获成功，陇右三郡望风归附，但因马谡失街亭功亏一篑。含泪斩马谡，自降三级以示负责；西城空城计独坐城楼抚琴，司马懿疑有埋伏退兵。"},{"year":"234年","event_id":"wuzhangyuan","location_id":"loc_wuzhangyuan","desc":"第六次北伐，积劳成疾，自知不久于人世。安排后事，嘱秘不发丧有序撤兵。临终仍安排木马退兵之计，司马懿见木像惊退，百姓语：死诸葛吓跑活仲达。享年54岁。"}],"relations":[{"target_id":"liubei","rel":"君臣知己","desc":"三顾之恩铭记终身，白帝城托孤后更是全力报效。两人是中国历史君臣相得的最高典范。"},{"target_id":"simayui","rel":"毕生宿敌","desc":"多次在关中祁山对峙，诸葛亮屡次挑衅，司马懿坚守不出。诸葛亮曾送女人衣裳羞辱，司马懿欣然接受不为所动。两人都深知对方是自己最强的敌手。"},{"target_id":"zhouyu","rel":"合作与博弈","desc":"赤壁时名义上合作，实则互相提防。演义中三气周瑜之说有夸张，但两人智谋较量是三国最精彩的段落之一。周瑜临终叹：既生瑜，何生亮！"},{"target_id":"mashu","rel":"师生/遗憾","desc":"视马谡为奇才极为赞赏，但刘备临终曾提醒：马谡言过其实，不可大用。诸葛亮未能记取，街亭之败后含泪斩马谡是其一生最痛苦的决定之一。"},{"target_id":"weiyan","rel":"复杂君臣","desc":"魏延勇猛善战多次重用，但始终不信任。坚决拒绝子午谷奇谋，临终留锦囊料定魏延必反，安排马岱随时斩杀，此举争议至今。"},{"target_id":"liuchan","rel":"辅政","desc":"出师表称刘禅陛下，实际总揽大权，刘禅言听计从。诸葛亮死后蜀汉迅速走下坡路，证明一切皆系于其一人。"}]},{"id":"zhaoyun","name":"赵云","type":"character","faction":"蜀汉","title":"镇军将军","born":"168年","died":"229年","bio":"字子龙，常山真定人，五虎上将之一，人称常胜将军。早年曾短暂追随袁绍，因不满其为人转投公孙瓒，后结识刘备情意相投。长坂坡单骑救主是其最著名事迹：在数十万曹军中七进七出，抱着婴儿阿斗冲出重围。一生少有败绩，晚年仍参加北伐。其特殊之处在于，他不仅是勇将，更是政治清醒的忠臣——多次直谏刘备，反对夷陵之战，劝阻孙尚香带阿斗回吴，截江救主。","timeline":[{"year":"200年","event_id":"","location_id":"ye","desc":"因不满袁绍，转投公孙瓒，后辗转结识刘备深为倾心，因兄长丧事暂时离去，约定他日再来。"},{"year":"208年","event_id":"changban","location_id":"dangyang","desc":"长坂坡大战：刘备军大败溃散，赵云独自在数十万曹军中来回冲突，先救出甘夫人，再找到负伤的糜竺和婴儿阿斗，单骑护着阿斗冲出重围，浑身是血。刘备接到阿斗，掷于地曰：为此孺子，险折我一员大将！赵云感激零涕。"},{"year":"211年","event_id":"","location_id":"jingzhou","desc":"孙权欲接孙尚香母子归吴，带走阿斗。赵云单舸追上东吴大船，凭一人之力夺回阿斗，保住蜀汉储君。"},{"year":"221年","event_id":"yiling","location_id":"loc_yiling","desc":"刘备执意伐吴，赵云直谏：国贼是曹操非孙权也，若先灭魏则吴自服。刘备不听，只派赵云驻守江州作为后援，赵云的判断最终被证明正确。"},{"year":"228年","event_id":"jietingzhan","location_id":"jietin","desc":"北伐偏师出箕谷，街亭失守后撤军，赵云亲自断后，烧掉营寨，将辎重有序带回，无一人伤亡。诸葛亮感叹：子龙一身都是胆！"}],"relations":[{"target_id":"liubei","rel":"君臣","desc":"长坂坡救主让两人情义深厚，但赵云始终未得到与功劳相称的独立统兵机会，长期担任护卫角色。"},{"target_id":"liuchan","rel":"护主","desc":"两次救出阿斗，是刘禅最重要的救命恩人。"},{"target_id":"zhugeliang","rel":"君臣","desc":"北伐中配合默契，诸葛亮对赵云极为信任。"}]},{"id":"caocao","name":"曹操","type":"character","faction":"曹魏","title":"魏武帝","born":"155年","died":"220年","bio":"字孟德，沛国谯县人。东汉末年最杰出的政治家、军事家、文学家，也是最具争议的人物。以「宁教我负天下人，休教天下人负我」著称。挟天子令诸侯，统一北方，奠定曹魏基础。用人唯才，不拘一格，麾下谋臣武将是三国中最强的团队。同时疑心极重，曾梦中杀人、误杀华佗。赤壁大败后实力大损，此后专注于经营北方，文治武功均有建树，有《短歌行》等文学名作传世。","timeline":[{"year":"184年","event_id":"","location_id":"luoyang","desc":"镇压黄巾起义，崭露头角，逐渐积累军事威望。"},{"year":"189年","event_id":"cichuidongzhuo","location_id":"luoyang","desc":"借献七星宝刀之名只身入相府行刺董卓，事机不密失败出逃，刺刀未出鞘便被董卓从镜中察觉，机智以献刀为名借马出逃。"},{"year":"190年","event_id":"fendong","location_id":"luoyang","desc":"矫诏聚义军讨伐董卓，诸侯推袁绍为盟主，曹操是最积极出战者，但联军普遍观望，终无功而返。"},{"year":"196年","event_id":"xietian","location_id":"xu","desc":"迎汉献帝至许都，挟天子令诸侯。此后以汉室名义征讨各方，政治上占据极大优势。"},{"year":"200年","event_id":"zhujiu","location_id":"xu","desc":"青梅煮酒论英雄，与刘备相对而坐，点名天下英雄只有他们二人。此举既是试探，也是曹操少有的洒脱时刻。"},{"year":"200年","event_id":"guandu","location_id":"loc_guandu","desc":"官渡之战，以不足三万兵力对抗袁绍十万大军，采纳许攸献计夜袭乌巢，一战奠定统一北方基础。"},{"year":"207年","event_id":"","location_id":"ye","desc":"北征乌桓，彻底平定北方边患，途中郭嘉病逝。曹操登碣石山，作观沧海，豪气干云。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"南征荆州，刘琮投降。随后赤壁大败，被周瑜黄盖火攻，损失惨重，退回北方。赤壁后曹操感叹：若奉孝在，不使孤至此！"},{"year":"219年","event_id":"hanzhong","location_id":"loc_hanzhong","desc":"汉中争夺战失利，被迫放弃汉中退守长安，首次在战略上对刘备集团失势。"},{"year":"220年","event_id":"","location_id":"luoyang","desc":"病逝洛阳，临终嘱咐薄葬，不树碑。谥号武，庙号太祖，其子曹丕追尊其为武皇帝。"}],"relations":[{"target_id":"liubei","rel":"政敌/相互欣赏","desc":"煮酒论英雄是两人关系的最佳写照：曹操视刘备为同等量级的对手，刘备则在曹操眼皮下韬光养晦。"},{"target_id":"guanyu","rel":"爱才","desc":"关羽降曹期间，曹操以赤兔马、封侯、厚待三事拢络，但关羽义无反顾离去。此后华容道关羽义释曹操，被演义渲染为两人恩义的延续。"},{"target_id":"simayui","rel":"君臣/戒备","desc":"曹操临终曾言：司马懿鹰视狼顾，不可付以兵权，子弟亦不得重用。但曹丕仍重用司马懿，曹魏最终为其所夺。"},{"target_id":"xunyu","rel":"君臣/悲剧","desc":"荀彧是曹操最重要的谋士，被誉为吾之子房。但荀彧忠于汉室，当曹操欲称魏公时，荀彧持反对意见，曹操送其一个空食盒，荀彧领会其意，服毒自尽。"},{"target_id":"guojia","rel":"最爱谋臣","desc":"郭嘉是曹操最钟爱的谋士，官渡前十胜十败论坚定曹操决心。37岁早逝，赤壁大败后曹操痛哭：若奉孝在，不使孤至此！"},{"target_id":"caopi","rel":"父子","desc":"曹操在世时曹丕与曹植争世子之位，曹操偏爱曹植才华，最终在贾诩等人建议下立曹丕。"},{"target_id":"dianwei","rel":"卫士","desc":"宛城之战典韦断后战死保护曹操，曹操为此痛哭，称哭典韦胜过哭自己儿子曹昂。"}]},{"id":"simayui","name":"司马懿","type":"character","faction":"曹魏","title":"太傅","born":"179年","died":"251年","bio":"字仲达，河内温县人。曹魏四朝元老，以忍耐和老谋深算著称。年轻时装病不肯为曹操效力，被强征入仕后韬光养晦。与诸葛亮多次对峙，以持久战克制其北伐。高平陵政变一举铲除曹爽，独掌曹魏大权，为西晋奠基。其最大特点是：看似无为，实则每一步都在等待时机，堪称三国时代最有耐心的政治家。","timeline":[{"year":"208年","event_id":"","location_id":"xu","desc":"被曹操强征入仕，此前曾装病推辞。入仕后韬光养晦，小心侍奉，逐渐获得信任。"},{"year":"220年后","event_id":"","location_id":"luoyang","desc":"曹丕时期受到重用，成为最重要的辅政大臣之一。"},{"year":"228-234年","event_id":"jietingzhan","location_id":"qishan","desc":"多次与诸葛亮对峙于关中祁山。采取坚守策略，拒绝出战。诸葛亮曾送女人衣裳羞辱，司马懿欣然接受，令将士们心服口服，也让诸葛亮无计可施。"},{"year":"234年","event_id":"wuzhangyuan","location_id":"loc_wuzhangyuan","desc":"五丈原相持百余日，诸葛亮病逝，蜀军有序撤退。司马懿追击，见到蜀军摆出诸葛亮木像阵势，疑为诈死不敢深追，被百姓讥笑死诸葛吓跑活仲达。"},{"year":"249年","event_id":"gaopingling","location_id":"luoyang","desc":"高平陵政变：趁曹爽陪魏帝出城祭陵，司马懿以迅雷之势控制洛阳，以太后懿旨弹劾曹爽。曹爽手握重兵却优柔寡断，最终选择投降，被司马懿诛灭三族。此后曹魏大权尽入司马氏。"},{"year":"251年","event_id":"","location_id":"luoyang","desc":"病逝，享年72岁。临终嘱咐薄葬，不得起冢，被追封为宣王，其孙司马炎建晋后追尊为宣帝。"}],"relations":[{"target_id":"zhugeliang","rel":"毕生宿敌","desc":"两人都深知对方是自己最强的对手，诸葛亮屡次挑衅急于决战，司马懿坚守不出以逸待劳。两人的较量是智谋与耐力的终极比拼，结局是诸葛亮先逝。"},{"target_id":"caocao","rel":"君臣","desc":"曹操始终对司马懿存有戒心，临终提醒子孙不可重用。但曹丕偏偏信用，最终应验了曹操的判断。"},{"target_id":"caoshuang","rel":"政敌","desc":"高平陵政变前，司马懿装病多年让曹爽彻底放松警惕，一朝发难，曹爽集团灰飞烟灭。"},{"target_id":"simashi","rel":"父子","desc":"长子继承父亲权位，继续掌控曹魏。"},{"target_id":"simazhao","rel":"父子","desc":"次子最终策划灭蜀，司马氏的权力顶点。"}]},{"id":"guojia","name":"郭嘉","type":"character","faction":"曹魏","title":"军师祭酒","born":"170年","died":"207年","bio":"字奉孝，颍川阳翟人。曹操最钟爱的谋士，料事如神，以超强的战略预判能力著称。早年投奔袁绍，见袁绍不能用人后离去，转投曹操，一见如故，曹操叹：使孤成大业者，必此人也。官渡前十胜十败论坚定曹操决心。37岁在北征乌桓途中病逝，曹操赤壁大败后痛哭流涕：若奉孝在，不使孤至此！","timeline":[{"year":"196年","event_id":"","location_id":"xu","desc":"投奔曹操，曹操与其彻夜长谈，视为知己，任命为军师祭酒。"},{"year":"200年","event_id":"guandu","location_id":"loc_guandu","desc":"官渡前提出十胜十败论，从政治、道德、谋略等十个方面论证曹操必胜袁绍，坚定了曹操抗衡的信心。"},{"year":"207年","event_id":"","location_id":"ye","desc":"北征乌桓途中病重，仍坚持随军。曹操提出若撤军则恐刘表趁机而入，郭嘉料定刘表不会出兵，事后果然应验，但郭嘉也在班师途中病逝，年仅37岁。"}],"relations":[{"target_id":"caocao","rel":"最爱谋臣","desc":"曹操最心爱的谋士，视其为知己。郭嘉早逝令曹操赤壁后痛悔不已。"},{"target_id":"xunyu","rel":"同僚","desc":"两人同为曹操首席谋士，郭嘉偏重军事，荀彧偏重政务，互相补充。"}]},{"id":"xunyu","name":"荀彧","type":"character","faction":"曹魏","title":"尚书令","born":"163年","died":"212年","bio":"字文若，颍川颍阴人，出身名门。曹操最重要的战略谋士，被誉为吾之子房。早年投袁绍，见其不可成事，转投曹操。多次为曹操出关键之策：迎天子、急攻吕布、官渡坚守。然而荀彧本质上忠于汉室，曹操欲称魏公时，荀彧明确表示反对，曹操深恨之，送其一个空食盒以示无以相赠，荀彧领会其意，含毒自尽，一代名臣以悲剧收场。","timeline":[{"year":"191年","event_id":"","location_id":"xu","desc":"离袁绍投曹操，称曹操能匡扶汉室，此后成为其首席战略谋臣。"},{"year":"196年","event_id":"xietian","location_id":"xu","desc":"力主迎汉献帝至许都，挟天子令诸侯，此为曹操最重要的政治基础，荀彧居功至伟。"},{"year":"200年","event_id":"guandu","location_id":"loc_guandu","desc":"官渡相持粮草将尽时，曹操欲退兵，荀彧去信力劝坚守：此正是奇变之时，万不可退。曹操采纳，最终取胜。"},{"year":"212年","event_id":"","location_id":"xu","desc":"曹操欲进爵魏公，荀彧认为此举违背曹操匡扶汉室的初衷，明确反对。曹操遂送空食盒给荀彧，荀彧服毒自尽，时年49岁。"}],"relations":[{"target_id":"caocao","rel":"君臣/悲剧","desc":"曹操最重要的谋士，却因政治理念分歧而被逼死，是三国最令人惋惜的悲剧之一。"},{"target_id":"xuniyou","rel":"叔侄","desc":"荀攸为其侄，叔侄二人同为曹操谋士，相辅相成。"}]},{"id":"jiaxu","name":"贾诩","type":"character","faction":"曹魏","title":"太尉","born":"147年","died":"223年","bio":"字文和，武威姑臧人。三国第一毒士，以算计人心著称，先后辅佐董卓、李傕郭汜、张绣、曹操等多位主公，每次都能全身而退。计谋以奇险著称：宛城之战后劝张绣二度叛曹、官渡时分析必胜之策、赤壁后劝曹操安抚将士休养生息，均一语中的。晚年低调藏拙，明哲保身，以77岁高龄善终，是三国最长寿的重要谋士。","timeline":[{"year":"192年","event_id":"","location_id":"changan","desc":"董卓死后，贾诩建议李傕郭汜不要散兵逃走，而应反攻长安，直接导致王允被杀、献帝再次陷入藩镇控制。此计虽毒，却救了自己的命。"},{"year":"197年","event_id":"","location_id":"wancheng","desc":"辅佐张绣，出策宛城诈降后叛变，导致典韦、曹昂死亡，曹操几乎丧命。此后又力劝张绣在曹袁对峙时投曹而非投袁，张绣降曹后受到善待。"},{"year":"200年","event_id":"guandu","location_id":"loc_guandu","desc":"张绣降曹后，贾诩分析曹操必胜袁绍的五个理由，坚定了曹操决心。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"赤壁之战前贾诩劝曹操暂缓南进，以河北新附民心为由，曹操不听，遭致赤壁惨败。"},{"year":"217年","event_id":"","location_id":"xu","desc":"曹丕与曹植争世子，贾诩以袁绍、刘表废长立幼之祸为例，劝曹操立曹丕，起了决定性作用，此后被曹丕奉为恩人。"}],"relations":[{"target_id":"caocao","rel":"君臣","desc":"曹操深知贾诩是乱世中最危险的谋士，但也最能借其奇谋制胜。"},{"target_id":"caopi","rel":"辅佐","desc":"劝曹操立曹丕为世子，曹丕称帝后任其为太尉，以最高礼遇相待。"}]},{"id":"sunquan","name":"孙权","type":"character","faction":"东吴","title":"吴大帝","born":"182年","died":"252年","bio":"字仲谋，孙坚次子，孙策之弟。19岁继位执掌江东，一手将父兄草创的基业发展为三国之一。联刘抗曹是其最重要的外交战略，赤壁之战奠定三足鼎立格局。但他也是孙刘联盟的终结者——命吕蒙袭取荆州、杀关羽，导致蜀吴大战。晚年性情大变，大肆杀戮功臣，为立嗣问题内耗国力，使东吴提前走向衰败。曹操曾叹曰：生子当如孙仲谋。","timeline":[{"year":"200年","event_id":"","location_id":"jiangdong","desc":"孙策遇刺身亡，年仅19岁的孙权继位。孙策临终嘱托张昭等辅政，并对孙权说：内事不决问张昭，外事不决问周瑜。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"曹操南下，麾下大臣多主降，孙权在鲁肃和周瑜的支持下力排众议，联合刘备抗曹。赤壁大战是孙权一生最重要的政治军事决策。"},{"year":"215年","event_id":"xiaoyaojin","location_id":"hefei","desc":"率十万大军攻合肥，遭张辽八百骑突袭，险些被擒，凌统死战护主方得脱险，此战令孙权刻骨铭心，此后再未亲临前线。"},{"year":"219年","event_id":"maicheng","location_id":"jingzhou","desc":"命吕蒙白衣渡江袭取荆州，斩关羽，彻底终结孙刘联盟的荆州争端。为此付出了触怒刘备的代价，引来夷陵之战。"},{"year":"222年","event_id":"yiling","location_id":"loc_yiling","desc":"夷陵之战，陆逊火烧刘备连营，东吴转危为安。之后孙权主动向曹魏称藩以避免两线作战，局面稳定后再称帝。"},{"year":"229年","event_id":"","location_id":"jianye","desc":"在武昌（今鄂州）正式称帝，国号吴，随后迁都建业（今南京）。"},{"year":"240年代","event_id":"","location_id":"jianye","desc":"晚年猜忌功臣，屡起大狱。为立嗣问题，长期在孙和、孙霸之间摇摆，酿成二宫之争，陆逊被迫害致死，东吴元气大伤。"}],"relations":[{"target_id":"sunceo","rel":"兄弟","desc":"继承孙策基业，孙策临终交代的是孙权不如他的地方，但孙权最终成就更大。"},{"target_id":"zhouyu","rel":"君臣","desc":"最重要的大都督，赤壁的胜利离不开周瑜的战略执行。"},{"target_id":"lyumeng","rel":"君臣","desc":"夺荆州的直接执行者，吕蒙之死令孙权痛惜。"},{"target_id":"luxun","rel":"君臣","desc":"夷陵之战统帅，晚年却因立嗣之争被孙权猜忌逼死，孙权最大的政治污点之一。"},{"target_id":"guanyu","rel":"宿敌","desc":"关羽虎女焉能嫁犬子一句话彻底激怒孙权，最终导致关羽被杀。"},{"target_id":"liubei","rel":"盟友/对手","desc":"孙刘联盟是赤壁胜利的基础，但荆州问题始终是矛盾核心，最终彻底决裂。"}]},{"id":"zhouyu","name":"周瑜","type":"character","faction":"东吴","title":"大都督","born":"175年","died":"210年","bio":"字公瑾，庐江舒县人，出身士族，风姿英俊，精通音律，人称周郎。与孙策是少年至交，结为兄弟，孙策娶大乔，周瑜娶小乔，一时传为美谈。赤壁之战是其军事生涯的顶点，以约三万人对曹操二十余万，采纳黄盖苦肉计，一把火奠定三分天下格局。演义中有三气周瑜之说，历史上周瑜气量宽宏，临终推荐鲁肃接任，并无嫉妒诸葛亮的记载，演义有所夸大。","timeline":[{"year":"194年","event_id":"","location_id":"jiangdong","desc":"在舒县结识孙策，两人一见如故，结为异姓兄弟，周瑜倾力助孙策横扫江东。"},{"year":"200年","event_id":"","location_id":"jiangdong","desc":"孙策遇刺身亡，周瑜回吴奔丧，继续辅佐年轻的孙权。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"赤壁之战全程主导：识破庞统连环计是己方所献（演义），采纳黄盖苦肉计，把握东南风时机发动火攻，一战成名。赤壁后继续攻打南郡，腰部中箭。"},{"year":"210年","event_id":"","location_id":"jiangling","desc":"南郡争夺战中伤势反复，勉强攻取南郡。随后欲进军益州取刘璋，途经巴丘时伤重不治，病逝，年仅36岁。临终推荐鲁肃接任大都督。"}],"relations":[{"target_id":"sunceo","rel":"结拜兄弟","desc":"少年至交，并称孙周，共同打下江东基础。"},{"target_id":"sunquan","rel":"君臣","desc":"赤壁的最大功臣，孙权最信任的大都督。"},{"target_id":"lushu","rel":"同僚","desc":"两人互为补充，周瑜主战，鲁肃擅长外交和战略。"},{"target_id":"zhugeliang","rel":"博弈","desc":"演义中三气周瑜系虚构，历史上周瑜气量宽宏，但两人的智谋博弈是三国演义最精彩的章节。"},{"target_id":"xiaoqiao","rel":"夫妻","desc":"小乔之美与周瑜之才并称江东，曹操赤壁前曾有二乔锁于铜雀台的传说。"}]},{"id":"lushu","name":"鲁肃","type":"character","faction":"东吴","title":"大都督","born":"172年","died":"217年","bio":"字子敬，临淮东城人，东吴战略家。出身富豪，慷慨好施，早年将家产接济周瑜而结交。榻上策（东吴的隆中对）是其战略贡献：建议孙权占据长江，与曹操南北对峙，图谋帝王之业。孙刘联盟最重要的推手，周瑜死后继任大都督，始终致力于维持两家同盟。为人宽厚，曾与关羽单刀赴会（演义中是关羽，历史上实为鲁肃），维持荆州借贷局面。","timeline":[{"year":"200年","event_id":"","location_id":"jiangdong","desc":"投奔孙权，提出榻上策：汉室不可复兴，曹操不可卒除，建议孙权鼎足江东，进而图谋天下，比诸葛亮隆中对早七年。"},{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"赤壁前力主联刘抗曹，亲赴荆州接触诸葛亮，是孙刘联盟的直接促成者。赤壁后主张将荆州借给刘备，以集中力量对付曹操。"},{"year":"215年","event_id":"","location_id":"jingzhou","desc":"荆州归属问题激化，鲁肃与关羽单刀赴会，单骑赴约，据理力争，维持了双方关系不破裂。"}],"relations":[{"target_id":"sunquan","rel":"君臣","desc":"最重要的战略谋臣，榻上策是孙权的立国基础。"},{"target_id":"zhouyu","rel":"同僚","desc":"两人互相信任，周瑜死前推荐鲁肃接任。"},{"target_id":"zhugeliang","rel":"对应","desc":"东吴的诸葛亮，两人都是各自阵营的战略设计师。"},{"target_id":"guanyu","rel":"对手","desc":"荆州问题上的直接谈判对手，以外交手段维持两家表面和平。"}]},{"id":"lyumeng","name":"吕蒙","type":"character","faction":"东吴","title":"大都督","born":"178年","died":"220年","bio":"字子明，汝南富陂人。早年行伍出身，被讥为吴下阿蒙，后发愤读书，令老友鲁肃刮目相看，留下士别三日当刮目相待的典故。军事才能卓越，夺取荆州是其最大功绩：以白衣渡江之计，扮成商人悄然接管沿途城池，一举拿下关羽后方。然而就在大功告成后不久，吕蒙便病逝，享年约42岁，有说是关羽魂魄索命，民间传说色彩浓厚。","timeline":[{"year":"215年","event_id":"","location_id":"jingzhou","desc":"已晋升为重要将领，开始谋划夺取荆州的策略，向孙权提出详细的袭取方案。"},{"year":"219年","event_id":"maicheng","location_id":"jingzhou","desc":"佯称染病离职，换陆逊接替以麻痹关羽。随后以白衣渡江之计，率军扮商人乘船，悄然接管荆州各地守军，兵不血刃取荆州。关羽南返途中父子被擒，孙权大喜，吕蒙完成一生最重要功业。"},{"year":"220年","event_id":"","location_id":"jianye","desc":"大功之后，吕蒙忽然重病，孙权千方百计延医诊治，仍无力回天，病逝。民间传说关羽魂魄附身，令其七窍流血而死。"}],"relations":[{"target_id":"sunquan","rel":"君臣","desc":"孙权最信任的大都督，夺荆州的核心执行者。"},{"target_id":"lushu","rel":"接任","desc":"鲁肃死后继任大都督，战略上转为主动夺荆州。"},{"target_id":"guanyu","rel":"宿敌","desc":"白衣渡江杀关羽，功成旋即病逝，命运充满戏剧性。"},{"target_id":"luxun","rel":"接任","desc":"吕蒙死后陆逊接任，夷陵之战再立大功。"}]},{"id":"luxun","name":"陆逊","type":"character","faction":"东吴","title":"丞相","born":"183年","died":"245年","bio":"字伯言，吴郡吴县人，出身江东大族。外表文弱，实则文武兼备。夷陵之战以火烧连营七百里大破刘备，是其军事生涯的巅峰；此后任丞相，主持东吴内政，是吴国最重要的支柱。晚年卷入立嗣之争（二宫之争），陆逊数次上疏劝孙权，反遭猜忌，孙权斥责其干涉宫廷，陆逊忧愤而死，年62岁。","timeline":[{"year":"219年","event_id":"","location_id":"jingzhou","desc":"吕蒙借故让陆逊接替荆州防务，以麻痹关羽。陆逊致书关羽示弱，关羽果然轻视，抽调兵力北伐。"},{"year":"222年","event_id":"yiling","location_id":"loc_yiling","desc":"刘备七十万大军来犯，东吴诸将主张迎击，陆逊力排众议坚守不战。相持半年，等到刘备连营深入、士气松弛、暑气蒸腾之时，一声令下火烧七百里连营，蜀军土崩瓦解，刘备逃至白帝城。"},{"year":"228年","event_id":"","location_id":"hefei","desc":"石亭之战大破曹休，威震曹魏，是夷陵后陆逊的重要战功。"},{"year":"244年","event_id":"","location_id":"jianye","desc":"因立嗣问题数次上书劝谏孙权，孙权大怒，数遣使者诘责，陆逊在忧愤中病逝，年62岁。"}],"relations":[{"target_id":"sunquan","rel":"君臣","desc":"最重要的大都督，但晚年被猜忌逼死，是孙权最大的政治污点。"},{"target_id":"lyumeng","rel":"接任","desc":"吕蒙死后接任大都督，夷陵成就更大声望。"},{"target_id":"liubei","rel":"战场宿敌","desc":"夷陵之战彻底打垮刘备，使蜀汉从此无力主动进攻。"}]},{"id":"lyubu","name":"吕布","type":"character","faction":"其他","title":"温侯","born":"?","died":"199年","bio":"字奉先，五原郡九原县人，三国第一武将。使方天画戟，骑赤兔马，武力无双，万夫难当。先认丁原为义父，被董卓以金银赤兔马收买后杀丁原；又认董卓为义父，被王允以美人计离间后杀董卓，因此被骂三姓家奴。虽武力天下第一，政治上却极为短视，无战略眼光，部将离心，最终在下邳被曹操活捉，白门楼被绞死。临终苦求刘备说情，刘备却一句话送了他的命。","timeline":[{"year":"189年","event_id":"sha_dingyuan","location_id":"luoyang","desc":"被董卓以金银财宝和赤兔宝马收买，夜间斩杀义父丁原，提头投奔董卓，认其为义父。"},{"year":"190年","event_id":"hulaoguan","location_id":"loc_hulaoguan","desc":"虎牢关前，先连斩华雄，再独战八路诸侯，无人能敌。关东联军中只有刘备三兄弟联手出战，三英战吕布，吕布且战且退，最终退回关内。"},{"year":"192年","event_id":"sha_dongzhuo","location_id":"changan","desc":"被王允的连环计离间，见貂蝉多次被董卓霸占，怒而刺杀董卓，完成王允的计划。"},{"year":"194年","event_id":"","location_id":"xuzhou","desc":"趁刘备征讨袁术，奇袭徐州，占据刘备根基之地。后刘备无处可去，又收容刘备寄居小沛，反复无常。"},{"year":"198年","event_id":"baimen","location_id":"xiapi","desc":"曹操与刘备联手围困下邳。吕布部将侯成等因不满吕布而反叛，将吕布捆绑送交曹操。白门楼上，吕布苦苦哀求曹操留其一命，曹操有意留用，问刘备意见。刘备说：公不见丁原、董卓之事乎？曹操遂令处斩，吕布骂道：大耳儿，最无信者！含恨而死。"}],"relations":[{"target_id":"diaochan","rel":"情人","desc":"貂蝉美人计彻底离间吕布与董卓，是吕布最大的政治弱点。"},{"target_id":"caocao","rel":"被擒杀","desc":"下邳之战被部将出卖，白门楼被绞杀。"},{"target_id":"liubei","rel":"曾庇护/被送死","desc":"吕布曾多次收留刘备，刘备却在关键时刻送走了他，此事令后世争议颇多。"},{"target_id":"dongzhuo","rel":"义父/被杀","desc":"认董卓为义父后为连环计所离间，最终弑父。"}]},{"id":"yuanshao","name":"袁绍","type":"character","faction":"其他","title":"冀州牧","born":"?","died":"202年","bio":"字本初，汝南汝阳人，出身四世三公名门，是东汉末年最强大的军阀。讨董卓时担任盟主，随后吞并冀州、占据幽青冀并四州，雄兵十余万，是官渡之战前实力最强的诸侯。但优柔寡断、刚愎自用，官渡之战前不听田丰、沮授等谋士的正确建议，拒绝许攸的偷袭乌巢计划，最终败于兵少粮竭的曹操，此后一蹶不振，忧郁病逝。","timeline":[{"year":"190年","event_id":"fendong","location_id":"luoyang","desc":"讨董联军盟主，坐镇后方而非亲临一线，错失消灭董卓的战机。"},{"year":"191年","event_id":"","location_id":"jizhou","desc":"用计杀韩馥，夺取冀州，拉开北方兼并战争。"},{"year":"200年","event_id":"guandu","location_id":"loc_guandu","desc":"官渡之战：拥兵十余万，后勤充足，却屡屡做出错误决策——杀田丰、不听沮授、追杀许攸家属迫其叛逃，最终被曹操一把火烧了乌巢粮仓，大军崩溃。"},{"year":"202年","event_id":"","location_id":"ye","desc":"官渡惨败后，内部兄弟相争，袁绍在忧郁和疾病中病死，未能重整旗鼓。"}],"relations":[{"target_id":"caocao","rel":"政敌","desc":"官渡之战决定性失败，从此北方格局逆转。"},{"target_id":"tianfeng","rel":"君臣","desc":"田丰多次正确预见，袁绍不听，大败后反将田丰下狱杀死，令人痛惜。"},{"target_id":"xuiyou","rel":"君臣","desc":"许攸家属被捕，他一怒叛投曹操，献烧乌巢之计，是袁绍失败的直接原因之一。"}]},{"id":"dongzhuo","name":"董卓","type":"character","faction":"其他","title":"太师","born":"?","died":"192年","bio":"字仲颖，陇西临洮人，凉州军阀，以残暴著称。何进引其入京后，趁乱掌握兵权，废少帝立献帝（汉献帝），独揽大权，倒行逆施。强迁都城至长安，焚烧洛阳，荼毒百姓，是东汉末年最大的破坏者。重用吕布为护卫，却因连环计中了貂蝉美人计，被吕布所杀。","timeline":[{"year":"189年","event_id":"shichang","location_id":"luoyang","desc":"何进引兵入京，趁乱控制兵权，废少帝刘辩，立刘协为汉献帝，自任太师，独揽大权。"},{"year":"190年","event_id":"","location_id":"changan","desc":"关东联军讨伐，董卓被迫西迁都城，临走前纵兵焚烧洛阳，杀戮百姓，使这座千年古都化为废墟。"},{"year":"192年","event_id":"sha_dongzhuo","location_id":"changan","desc":"王允施连环计，貂蝉离间吕布，吕布于凤仪亭后愤怒难平。王允趁机游说，吕布于宫门处刺杀董卓，董卓大叫吾儿奉先何在，被一戟刺死，其尸体被暴于市，百姓欢呼。"}],"relations":[{"target_id":"lyubu","rel":"义父/被杀","desc":"认吕布为义子，授赤兔马，却因连环计被吕布所杀。"},{"target_id":"wangyun","rel":"政敌","desc":"被王允连环计所除，是汉末政治运作的典型案例。"},{"target_id":"han_xiandi","rel":"控制者","desc":"立献帝为傀儡，开挟天子之先例，为后来曹操提供了模板。"}]},{"id":"machao","name":"马超","type":"character","faction":"蜀汉","title":"骠骑将军","born":"176年","died":"222年","bio":"字孟起，扶风茂陵人。五虎上将，西凉猛将。潼关大战曹操，杀得曹操割须弃袍，后归降刘备。","timeline":[{"year":"211年","event_id":"","location_id":"tongguan","desc":"潼关大战，杀得曹操割须弃袍"},{"year":"214年","event_id":"ruichuan","location_id":"chengdu","desc":"归降刘备，助攻益州"}],"relations":[{"target_id":"liubei","rel":"君臣","desc":"归降后受重用"},{"target_id":"caocao","rel":"仇敌","desc":"父仇不共戴天"}]},{"id":"huangzhong","name":"黄忠","type":"character","faction":"蜀汉","title":"后将军","born":"148年","died":"220年","bio":"字汉升，南阳人。五虎上将，老当益壮。定军山阵斩夏侯渊，汉中首功。","timeline":[{"year":"208年","event_id":"","location_id":"changsha","desc":"长沙与关羽大战，不分胜负"},{"year":"219年","event_id":"hanzhong","location_id":"loc_hanzhong","desc":"定军山斩夏侯渊，汉中首功"}],"relations":[{"target_id":"liubei","rel":"君臣","desc":"晚年归降，老当益壮"},{"target_id":"xiahouyuan","rel":"斩杀","desc":"定军山阵斩夏侯渊"}]},{"id":"weiyan","name":"魏延","type":"character","faction":"蜀汉","title":"前军师·征西大将军","born":"?","died":"234年","bio":"字文长，义阳人。智勇双全，诸葛亮北伐的重要将领。提出子午谷奇谋被否。诸葛亮死后因与杨仪争权被斩。","timeline":[{"year":"219年","event_id":"hanzhong","location_id":"loc_hanzhong","desc":"镇守汉中十余年，固若金汤"},{"year":"228年","event_id":"jietingzhan","location_id":"jietin","desc":"北伐中建议子午谷奇谋，被诸葛亮否决"},{"year":"234年","event_id":"wuzhangyuan","location_id":"loc_wuzhangyuan","desc":"五丈原后与杨仪争权，为马岱所斩"}],"relations":[{"target_id":"zhugeliang","rel":"君臣","desc":"才能出众但性格傲慢，被诸葛亮压制"},{"target_id":"yangyi","rel":"政敌","desc":"诸葛亮死后争权"}]},{"id":"jiangwei","name":"姜维","type":"character","faction":"蜀汉","title":"大将军","born":"202年","died":"264年","bio":"字伯约，天水人，原曹魏将领。被诸葛亮收降后成为蜀汉后期最重要的军事领袖，九伐中原，蜀汉灭亡后仍谋复国，最终力竭身死。","timeline":[{"year":"228年","event_id":"jietingzhan","location_id":"jietin","desc":"被诸葛亮收降，成为蜀汉将领"},{"year":"234年","event_id":"","location_id":"loc_hanzhong","desc":"继承诸葛亮遗志，多次北伐"},{"year":"263年","event_id":"shuhan_mie","location_id":"chengdu","desc":"蜀汉灭亡，欲借钟会之手复国，事败被杀"}],"relations":[{"target_id":"zhugeliang","rel":"师徒","desc":"得诸葛亮真传，是其最重要的军事传人"},{"target_id":"zhonghui","rel":"短暂合作","desc":"欲借钟会叛魏复蜀，计谋败露共死"}]},{"id":"pangtong","name":"庞统","type":"character","faction":"蜀汉","title":"军师中郎将","born":"179年","died":"214年","bio":"字士元，号凤雏。与诸葛亮并称卧龙凤雏。帮助刘备制定夺取益州的策略，落凤坡中箭身亡。","timeline":[{"year":"208年","event_id":"chibi","location_id":"loc_chibi","desc":"连环计建议曹操铁索连船，助赤壁之战成功"},{"year":"214年","event_id":"ruichuan","location_id":"luofengpo","desc":"入川途中在落凤坡被乱箭射死，英年早逝"}],"relations":[{"target_id":"zhugeliang","rel":"同门好友","desc":"卧龙凤雏，二者得一可安天下"},{"target_id":"liubei","rel":"君臣","desc":"献取益州之策，不幸早逝"}]},{"id":"fazheng","name":"法正","type":"character","faction":"蜀汉","title":"尚书令","born":"176年","died":"220年","bio":"字孝直，扶风郿人。刘备得益州、汉中的关键谋士，足智多谋，诸葛亮对其才能极为推崇。","timeline":[{"year":"214年","event_id":"ruichuan","location_id":"chengdu","desc":"献策帮助刘备取益州"},{"year":"219年","event_id":"hanzhong","location_id":"loc_hanzhong","desc":"汉中之战建议刘备占据险要，奇谋迭出"}],"relations":[{"target_id":"liubei","rel":"君臣","desc":"取益州汉中的关键谋士"},{"target_id":"zhugeliang","rel":"同僚","desc":"诸葛亮称其为当世奇才"}]},{"id":"mashu","name":"马谡","type":"character","faction":"蜀汉","title":"参军","born":"190年","died":"228年","bio":"字幼常，宜城人。诸葛亮爱将，颇有谋略，善于分析。然街亭之战违令失守，被诸葛亮含泪斩首，千古遗憾。","timeline":[{"year":"225年","event_id":"qinmeng","location_id":"nanzhong","desc":"建议诸葛亮攻心为上，七擒孟获"},{"year":"228年","event_id":"jietingzhan","location_id":"jietin","desc":"守街亭违令上山，被张郃断水，惨败失守"}],"relations":[{"target_id":"zhugeliang","rel":"君臣","desc":"爱将，失街亭后含泪斩之，自降三级"}]},{"id":"liuchan","name":"刘禅","type":"character","faction":"蜀汉","title":"蜀汉后主","born":"207年","died":"271年","bio":"字公嗣，小名阿斗。刘备之子，在位41年，诸葛亮死后宠信宦官黄皓，最终投降邓艾。乐不思蜀之典故主角。","timeline":[{"year":"208年","event_id":"changban","location_id":"dangyang","desc":"长坂坡赵云从万军中救出，方得存活"},{"year":"223年","event_id":"baidi","location_id":"loc_baidi","desc":"父亲白帝城托孤后即位，年幼"},{"year":"234年","event_id":"","location_id":"chengdu","desc":"诸葛亮死后，蜀汉政事渐衰"},{"year":"263年","event_id":"shuhan_mie","location_id":"chengdu","desc":"邓艾兵临城下，开城投降，蜀汉亡"}],"relations":[{"target_id":"liubei","rel":"父子","desc":"长坂坡差点因此丧命"},{"target_id":"zhugeliang","rel":"君臣","desc":"受其辅佐治理，蜀汉稳定数十年"}]},{"id":"wangping","name":"王平","type":"character","faction":"蜀汉","title":"镇北大将军","born":"?","died":"248年","bio":"字子均，益州人。识字不多却有将才，街亭之战力谏马谡无效，自守本部不败。后成为蜀汉重要将领。","timeline":[{"year":"228年","event_id":"jietingzhan","location_id":"jietin","desc":"力劝马谡当道下寨未被采纳，自保本军不败"}],"relations":[{"target_id":"mashu","rel":"同僚","desc":"街亭之战搭档，力劝无效"}]},{"id":"liaohua","name":"廖化","type":"character","faction":"蜀汉","title":"右车骑将军","born":"?","died":"264年","bio":"蜀汉后期重要将领，资历极深，从关羽时代就已入仕。蜀中无大将，廖化作先锋之典故。","timeline":[{"year":"219年","event_id":"maicheng","location_id":"loc_maicheng","desc":"麦城突围求援，刘封拒绝"},{"year":"263年","event_id":"shuhan_mie","location_id":"loc_hanzhong","desc":"蜀汉最后岁月仍坚守前线"}],"relations":[{"target_id":"guanyu","rel":"旧部","desc":"跟随关羽多年"}]},{"id":"jiangwan","name":"蒋琬","type":"character","faction":"蜀汉","title":"大司马","born":"?","died":"246年","bio":"字公琰，零陵人。诸葛亮死后蜀汉首席执政大臣，为人稳重，延续诸葛亮内政路线。","timeline":[{"year":"234年","event_id":"wuzhangyuan","location_id":"chengdu","desc":"诸葛亮病逝，接任执政"}],"relations":[{"target_id":"zhugeliang","rel":"继承者","desc":"诸葛亮指定的第一顺位接班人"}]},{"id":"feiyi","name":"费祎","type":"character","faction":"蜀汉","title":"大将军","born":"?","died":"253年","bio":"字文伟，江夏人。诸葛亮死后第二代执政，与蒋琬共同稳定蜀汉局势，主张与吴修好，限制姜维北伐。","timeline":[{"year":"234年","event_id":"wuzhangyuan","location_id":"chengdu","desc":"接替蒋琬执政，与姜维协调"},{"year":"253年","event_id":"","location_id":"chengdu","desc":"在岁旦大会被魏降人郭循刺杀身亡"}],"relations":[{"target_id":"jiangwei","rel":"上司","desc":"限制姜维兵权，主张休养生息"}]},{"id":"yangyi","name":"杨仪","type":"character","faction":"蜀汉","title":"中军师","born":"?","died":"235年","bio":"字威公，襄阳人。诸葛亮的重要参谋，主管军务。五丈原后与魏延争权，杀魏延后仍遭贬斥，自杀。","timeline":[{"year":"234年","event_id":"wuzhangyuan","location_id":"loc_wuzhangyuan","desc":"五丈原后统率撤军，与魏延决裂"},{"year":"235年","event_id":"","location_id":"loc_hanzhong","desc":"遭贬废为庶民后自杀"}],"relations":[{"target_id":"weiyan","rel":"政敌","desc":"诸葛亮死后争权火并"}]},{"id":"guanxing","name":"关兴","type":"character","faction":"蜀汉","title":"将领","born":"?","died":"?","bio":"关羽之子，关平之弟。夷陵之战后随诸葛亮北伐，多次立功，英年早逝。","timeline":[{"year":"221年","event_id":"yiling","location_id":"loc_yiling","desc":"夷陵之战随父报仇"}],"relations":[{"target_id":"guanyu","rel":"父子","desc":"继承父志"},{"target_id":"zhangbao","rel":"好友","desc":"与张苞并称"}]},{"id":"zhangbao","name":"张苞","type":"character","faction":"蜀汉","title":"将领","born":"?","died":"?","bio":"张飞之子。英勇善战，与关兴并称，英年早逝令刘备伤心不已。","timeline":[{"year":"221年","event_id":"yiling","location_id":"loc_yiling","desc":"夷陵之战表现勇猛"}],"relations":[{"target_id":"zhangfei","rel":"父子","desc":"继承父志"},{"target_id":"guanxing","rel":"好友","desc":"与关兴并称"}]},{"id":"guanping","name":"关平","type":"character","faction":"蜀汉","title":"将领","born":"?","died":"219年","bio":"关羽养子，随父镇守荆州。走麦城之战被擒，与关羽一同被斩首。","timeline":[{"year":"219年","event_id":"maicheng","location_id":"loc_maicheng","desc":"走麦城与父关羽一同被擒斩"}],"relations":[{"target_id":"guanyu","rel":"养父子","desc":"生死相随"}]},{"id":"liyan","name":"李严","type":"character","faction :[{"target_id":"diaochan","rel":"义父","desc":"连环计的核心人物"},{"target_id":"lyubu","rel":"同谋","desc":"合作诛杀董卓"}]},{"id":"diaochan","name":"貂蝉","type":"character","faction":"汉室","title":"歌伎","born":"?","died":"?","bio":"王允义女，四大美女之一。连环计主角，周旋于董卓与吕布之间，最终促成吕布诛杀董卓。","timeline":[{"year":"192年","event_id":"lianhuanji","location_id":"luoyang","desc":"被王允利用施连环计，同时许给吕布和董卓"},{"year":"192年","event_id":"fengyi","location_id":"luoyang","desc":"凤仪亭私会吕布，激化董卓吕布矛盾"}],"relations":[{"target_id":"wangyun","rel":"义父","desc":"受义父之命行连环计"},{"target_id":"lyubu","rel":"爱人","desc":"连环计核心"},{"target_id":"dongzhuo","rel":"被献","desc":"连环计工具"}]},{"id":"zhangjiou","name":"张角","type":"character","faction":"其他","title":"太平道首领","born":"?","died":"184年","bio":"太平道创始人，黄巾起义发动者，以苍天已死黄天当立为口号，起义当年病逝。","timeline":[{"year":"184年","event_id":"huangjin","location_id":"jizhou","desc":"发动黄巾起义，旋即病逝"}],"relations":[{"target_id":"liubei","rel":"间接促成","desc":"黄巾乱促成刘备起兵"}]},{"id":"dengai","name":"邓艾","type":"character","faction":"曹魏","title":"征西将军","born":"197年","died":"264年","bio":"字士载，曹魏名将，口吃但有大才。偷渡阴平，奇袭灭蜀，以三万之众覆灭蜀汉，是三国末期最重要的军事奇迹。战后遭钟会诬陷，在押送途中被杀，含冤而终。","timeline":[{"year":"263年","event_id":"shuhan_mie","location_id":"loc_hanzhong","desc":"偷渡阴平七百里险道，突破蜀汉防线"},{"year":"263年","event_id":"shuhan_mie","location_id":"chengdu","desc":"兵临绵竹，诸葛瞻父子战死，逼降刘禅"},{"year":"264年","event_id":"shuhan_mie","location_id":"chengdu","desc":"被钟会诬陷谋反，押送洛阳途中被杀"}],"relations":[{"target_id":"simazhao","rel":"君臣","desc":"灭蜀首功，却被猜忌杀害"},{"target_id":"zhonghui","rel":"对手","desc":"合力伐蜀，事后互相猜疑"}]},{"id":"zhonghui","name":"钟会","type":"character","faction":"曹魏","title":"镇西将军","born":"225年","died":"264年","bio":"字士季，颍川长社人，钟繇之子。主持正面攻蜀，灭蜀后居功自傲，联合姜维图谋割据西蜀，被部下所杀。","timeline":[{"year":"263年","event_id":"shuhan_mie","location_id":"loc_hanzhong","desc":"率主力十余万正面牵制姜维"},{"year":"264年","event_id":"shuhan_mie","location_id":"chengdu","desc":"灭蜀后联合姜维叛乱，为部下所杀"}],"relations":[{"target_id":"jiangwei","rel":"短暂同盟","desc":"欲共谋割据，事败俱亡"},{"target_id":"dengai","rel":"对手","desc":"合作伐蜀后互相陷害"}]},{"id":"huangjin","name":"黄巾起义","type":"event","year":"184年","location_id":"jizhou","background":"东汉末年，外戚宦官交替专权，土地兼并严重，百姓流离失所。太平道首领张角以苍天已死、黄天当立为口号，秘密传道三十余年，信徒数十万遍布各地，约定甲子年（184年）三月五日同时起义。","process":"张角三兄弟分别率部在冀州等地发难，信众头裹黄巾，故称黄巾军。义军迅速席卷大半个帝国，洛阳震动。朝廷皇甫嵩、卢植、朱儁三路镇压，曹操、孙坚、刘备、关羽、张飞等人皆在此役中崭露头角。张角于同年病逝，张宝、张梁相继战死，主力黄巾军被镇压，但各地残部继续活动多年。","outcome":"黄巾起义虽被镇压，但东汉中央权威一落千丈，地方豪强趁势拥兵自重，形成割据局面，乱世就此开端。刘备三兄弟、曹操、孙坚等后来的三国主角皆在此战中起步。","participants":["zhangjiou","zhangbao_hj","zhangliang_hj","liubei","caocao","sunjian","guanyu","zhangfei"]},{"id":"shichang","name":"十常侍之乱","type":"event","year":"189年","location_id":"luoyang","background":"汉灵帝刘宏驾崩，少帝刘辩即位，外戚大将军何进与宦官集团（以张让为首的十常侍）争夺朝政控制权。何进欲尽诛宦官，其妹何太后不同意，何进遂征召董卓等外兵入京造势。","process":"十常侍得知何进计划，抢先诱骗何进入宫，在长乐宫杀死何进。袁绍等人随即率兵冲入皇宫，逢宦官就杀，大小宦官两千余人被杀，其中不乏误杀无须的普通官员。张让等人劫持少帝出逃，被追上后投水自尽。此时董卓带兵进入洛阳，控制局面。","outcome":"十常侍覆灭，但何进之死导致权力真空，董卓趁乱入京掌权，引发更大的乱局。这一事件直接导致东汉政权的彻底崩溃。","participants":["hejin","dongzhuo","yuanshao","han_xiandi","han_lingdi"]},{"id":"dongzhuo_ru","name":"董卓入京","type":"event","year":"189年","location_id":"luoyang","background":"何进被杀，京城大乱，董卓率西凉铁骑3000人趁机进入洛阳，与原京城守军合并，势力大增。","process":"董卓进京后迅速掌握兵权，先废黜少帝刘辩（后毒死），立年仅9岁的刘协为汉献帝，自任太师，掌控军政大权。倒行逆施，朝堂之上拔刀恫吓，百官噤声，独断专行。命吕布为护卫，两人义父义子关系表面稳固。曹操趁献刀之机行刺失败出逃，发矫诏召集天下诸侯讨伐。","outcome":"董卓入京标志着东汉中央政府名存实亡，此后挟天子令诸侯的模式被曹操等后来者效仿。各路诸侯纷纷以讨伐董卓为名起兵，东汉末年的军阀混战正式拉开帷幕。","participants":["dongzhuo","lyubu","han_xiandi","hejin","caocao"]},{"id":"cichuidongzhuo","name":"曹操刺董卓","type":"event","year":"189年","location_id":"luoyang","background":"曹操目睹董卓专权倒行逆施，忧愤不已。司徒王允秘密组织反董力量，曹操决意孤身行刺，借献刀之名接近董卓。","process":"曹操携七星宝刀入相府，见董卓卧榻而陈留在侧。正欲拔刀，董卓从铜镜中发现曹操神情有异，转身问何故，曹操机智地跪地说：操有宝刀一口，献与相国。随后借口试马，纵马逃出洛阳。各城门已发出画影图形，曹操被中牟县令陈宫所获，陈宫念其忠义，弃官相随，共同出逃。后曹操在逃亡途中错杀吕伯奢一家，发出宁教我负天下人，休教天下人负我之语，令陈宫寒心离去。","outcome":"行刺失败，曹操出逃后以己家财散尽，矫传圣旨，号召天下诸侯起兵讨董，是其政治生涯的起点。","participants":["caocao","dongzhuo","lyubu"]},{"id":"fendong","name":"讨伐董卓联军","type":"event","year":"190年","location_id":"luoyang","background":"曹操矫传圣旨，各路诸侯响应，在酸枣会盟，袁绍被推举为盟主，共讨董卓。联军声势浩大，共有十七路诸侯，兵马达数十万。","process":"然而各路诸侯各怀私心，大多按兵不动，坐观成败。只有孙坚最为英勇，一路势如破竹打到汜水关，斩华雄（演义中为关羽所斩），率先攻入洛阳，在旧井中挖出传国玉玺秘而不宣。董卓被迫迁都长安，临走前纵兵焚烧洛阳宫殿，大肆屠杀，千年古都化为废墟。虎牢关前吕布出阵，连败诸侯，刘关张三英联手才勉强将其逼退。联军随后因袁绍、袁术内讧土崩瓦解，不了了之。","outcome":"讨董联军未能消灭董卓，却催生了各路诸侯割据局面：袁绍占冀州、曹操经营兖州、孙坚打下基础……三国格局的雏形在这次联军瓦解后逐渐成形。","participants":["yuanshao","caocao","sunjian","liubei","guanyu","zhangfei","lyubu","dongzhuo","huaxiong"]},{"id":"lianhuanji","name":"连环计","type":"event","year":"192年","location_id":"luoyang","background":"王允苦思除董之计，见府中歌姬貂蝉貌若天仙，且对汉室忠心，与吕布之间有爱慕之情，遂设下连环美人计。","process":"王允先将貂蝉许配给吕布，不久却将貂蝉献给董卓为妾。吕布怒不可遏，多次与貂蝉相会于凤仪亭。董卓某日突然撞见两人私会，怒掷手戟刺向吕布，吕布闪躲而过，两人矛盾彻底激化。王允趁机对吕布晓以大义：相国与君，义虽父子，其实本非骨肉，如今国家危急，望将军以天下苍生为重。","outcome":"连环计成功离间吕布和董卓，为后来吕布诛杀董卓埋下伏笔。貂蝉在其中扮演了关键角色，成为中国四大美女之一，以美色救汉室的形象流传千古。","participants":["wangyun","diaochan","lyubu","dongzhuo"]},{"id":"sha_dongzhuo","name":"吕布诛董卓","type":"event","year":"192年","location_id":"changan","background":"王允与吕布密谋，选择汉献帝大朝会之日动手，以献帝病愈为由召集百官，在宫门埋伏刀斧手。","process":"董卓入宫门时，吕布等人突然发难。董卓见状大呼：吾儿奉先何在！吕布厉声道：有诏讨贼！一戟刺入董卓腹部，董卓大叫倒地而死。其部将李傕郭汜逃往西凉。王允处死蔡邕，大赦董卓党羽，因处置失当引起反弹。李傕郭汜随后在贾诩建议下反攻长安，王允城陷被杀，吕布出逃，献帝再次成为傀儡。","outcome":"董卓虽死，但乱局并未平息。李傕郭汜控制长安、挟持献帝，天下依然大乱。王允的短视处置让这次除贼行动未能真正改变局面。","participants":["lyubu","dongzhuo","wangyun","diaochan","han_xiandi"]},{"id":"hulaoguan","name":"三英战吕布","type":"event","year":"190年","location_id":"loc_hulaoguan","background":"讨伐董卓联军进攻，董卓令吕布率大军守卫虎牢关。吕布武艺天下第一，各路诸侯无人能敌。","process":"先是华雄在汜水关连斩诸侯数员大将，联军惊惧。关羽请战，温酒一杯，出阵斩华雄于马下，回营时酒尚温。吕布出阵后，方悦、穆顺等武将相继被斩，北平太守公孙瓒也败下阵来，联军人人色变。张飞大骂而出，与吕布大战五十余合不分胜负。关羽随后加入，两人夹击，刘备也挥动双股剑上阵，三人车轮战吕布。吕布渐渐不支，虚刺一戟，拨马而走，退回关内。","outcome":"三英战吕布确立了刘关张三兄弟在天下诸侯中的地位，关羽温酒斩华雄之名也由此传开。此战虽未能消灭吕布，却让这三个无名之辈名扬天下。","participants":["lyubu","guanyu","liubei","zhangfei","huaxiong","yuanshao","gongsunzan"]},{"id":"baimen","name":"白门楼斩吕布","type":"event","year":"199年","location_id":"xiapi","background":"吕布占据徐州后，曹操数次出兵讨伐。此次曹操联合刘备共同围困下邳，水淹城池，吕布困守数月，粮草告急，部将离心。","process":"吕布部将侯成、宋宪、魏续等人因不满吕布嗜酒禁酒的矛盾，以及对前途的绝望，趁夜缚住熟睡中的吕布，开城门献降。吕布被押至白门楼，曹操亲自审问。吕布对曹操说：明公所患不过于布，布今已服，天下不足忧。明公将步，令布将骑，天下不难定也。曹操心动，有意留用，转问刘备意见。刘备冷冷一句：公不见丁原、董卓之事乎？言下之意，养虎必为患。曹操遂下令处斩。吕布大骂刘备：大耳儿，最无信者！随后被勒死，陈宫、高顺同时被杀。","outcome":"吕布之死终结了东汉末年第一猛将的传奇。刘备的一句话既保全了自己（消灭了曾袭取徐州的仇人），也显示出其政治狠辣的一面——对曾收留过自己的人落井下石，令后世对其仁义之名颇有质疑。","participants":["lyubu","caocao","liubei","zhangfei","guanyu"]},{"id":"xietian","name":"挟天子令诸侯","type":"event","year":"196年","location_id":"xu","background":"董卓死后，李傕郭汜相争，献帝辗转流离，从长安一路东归，沿途诸侯无人接应，朝廷百官饥寒交迫，狼狈至极。曹操在荀彧等谋士建议下，决定迎接献帝。","process":"曹操率军西迎献帝，将其安置于许县（改名许都）。从此以天子名义发号施令，朝廷百官皆受其节制。讨伐对手时打出朝廷旗号，政治上无往不利。献帝虽名为天子，实为曹操的政治工具，饮食起居均在监视之下，连上厕所都有士兵跟随。","outcome":"挟天子令诸侯成为曹操最大的政治优势，此后数十年间，各路诸侯反对曹操都背负着不忠于汉室的名声。这一手棋是曹操与荀彧共同下的最重要的政治布局。","participants":["caocao","han_xiandi","xunyu","chengyu"]},{"id":"guandu","name":"官渡之战","type":"event","year":"200年","location_id":"loc_guandu","background":"袁绍占据河北四州，雄兵十余万，实力远超曹操。双方决裂后，袁绍欲一举消灭曹操，统一北方。曹操兵不满三万，粮草不足，形势极为不利。此前郭嘉提出十胜十败论，从政治、谋略、军事等十个方面论证曹操必胜，坚定了曹操的信心。","process":"两军在官渡对峙，曹操数次交战略占下风，粮草告急，曾致信荀彧欲退守许都。荀彧回信力劝坚守，道出战机稍纵即逝之理。关键转折：袁绍谋士许攸因家人被袁绍手下抓捕，一怒之下深夜投奔曹操，献计奇袭袁绍囤粮之地乌巢。曹操大喜，亲率精锐五千人连夜急行，奔袭乌巢。守将淳于琼措手不及，粮草被焚一空。袁绍大营闻讯大乱，张郃、高览见大势已去，率部投降曹操。袁绍十余万大军在乌巢被烧后迅速崩溃，袁绍仅率数百骑狼狈渡河北逃。","outcome":"官渡之战是三国三大战役之一，以少胜多的典范。曹操此后乘胜追击，逐步吞并河北，袁绍忧郁而死，其子袁谭、袁尚内讧，北方最终一统于曹操之手。许攸的叛变是关键转折，而袁绍不纳田丰之谋、追杀许攸家属，是失败的根本原因。","participants":["caocao","yuanshao","xuiyou","tianfeng","guanyu","yanliou","wenchou","zhanghe","xunyu","guojia"]},{"id":"zhujiu","name":"煮酒论英雄","type":"event","year":"200年","location_id":"xu","background":"刘备依附曹操后，韬光养晦，每日在后园种菜，故意示人以无大志。曹操识破其心思，决意试探。","process":"曹操邀刘备青梅煮酒，单独相对，指着天边乌云说：龙能大能小，能升能隐……方今春深，龙乘时变化，犹人得志而纵横四海。问刘备：当世英雄，使君知之否？刘备列举袁术、袁绍、刘表、孙策、刘璋、张鲁、张绣等人，曹操一一否定，最后手指刘备，又指自己：今天下英雄，惟使君与操耳！刘备大惊，手中筷子落地，正好一声雷响，刘备顺势说：一震之威，乃至于此！掩盖了惊慌。曹操笑道：大丈夫亦畏雷乎？","outcome":"此事是三国演义中最著名的政治场景之一，展示了曹操的政治眼光和刘备的超强自我控制能力。曹操的英雄论实际上是一次警告，刘备的失箸掩盖则是一次成功的反侦察。","participants":["caocao","liubei"]},{"id":"yidaizao","name":"衣带诏","type":"event","year":"200年","location_id":"xu","background":"汉献帝不甘心做傀儡，秘密联络忠于汉室的朝臣。国舅车骑将军董承受献帝密诏，组织反曹密谋。","process":"献帝将讨曹密诏缝于玉带之中，赐给董承。董承秘密联络刘备、马腾、种辑、王服、吴硕等人，各自在衣带诏上签名，共谋除曹。然而事机不密，董承家奴告发，曹操大怒，将董承及其全家（包括怀孕的董贵妃）尽数诛杀，株连甚广。刘备因已提前出走徐州起兵，幸免于难；马腾后来也被曹操所杀。","outcome":"衣带诏事件是汉献帝唯一一次主动反抗，彻底失败后，曹操对皇室和朝臣控制更加严密，献帝此后再无任何实权。此事也成为刘备与曹操彻底决裂的导火索，刘备以反曹大义的旗帜，在政治上树立了正统形象。","participants":["han_xiandi","caocao","liubei"]},{"id":"sangumaolu","name":"三顾茅庐","type":"event","year":"207年","location_id":"longzhong","background":"刘备自新野起依附刘表，虽有根基却缺乏战略方向。徐庶临行时向刘备推荐隐居隆中的诸葛亮，称其为卧龙，得之可安天下。刘备遂决意亲往拜访。","process":"刘备与关羽张飞冒雪前往隆中，第一次扑空，童子说先生出游未归。第二次再往，诸葛亮又不在。关张二人颇为不满，张飞欲放火烧了草庐，被刘备喝止。第三次刘备独自前往，诸葛亮正在午睡，刘备恭恭敬敬在阶下侍立，一等数小时，张飞在门外心急如焚。诸葛亮起身接见，刘备屏退左右，诚恳陈述自己的困境与志向，请求出山相助。诸葛亮提出隆中对三分天下策：占荆州、取益州，联吴抗曹，待天下有变则两路出兵，北伐可成。刘备大喜，以师礼相待，诸葛亮出山。","outcome":"三顾茅庐是刘备一生中最重要的决策，也奠定了诸葛亮与刘备之间如鱼得水的君臣关系。隆中对的战略构想是蜀汉三十年国策的基础，尽管最终未能实现，但其战略眼光令后世叹服。","participants":["liubei","zhugeliang","guanyu","zhangfei"]},{"id":"changban","name":"长坂坡之战","type":"event","year":"208年","location_id":"dangyang","background":"曹操统一北方后，以迅雷之势南下荆州，刘琮不战而降，刘备措手不及。刘备在携带十余万依附百姓南逃途中，行军速度极慢，日行十余里。有人劝刘备抛弃百姓轻骑逃走，刘备说：夫济大事必以人为本，今人归吾，吾何忍弃去！曹操派曹纯率5000虎豹骑疾追。","process":"曹纯铁骑在当阳长坂坡追上刘备大军，刘备军大溃。刘备抛下妻子，带数十骑仓皇出逃。赵云发现甘夫人和幼主阿斗失散，单骑回头冲入曹军之中，救出甘夫人后怀抱阿斗，在曹军重围中七进七出，砍倒曹将数十员，最终冲出重围，将阿斗完好送至刘备手中。刘备接过阿斗摔于地上：为此孺子，几损我一员大将！赵云感激涕零。同时张飞率二十余骑断后，在当阳桥头横矛立马，大喝三声：我乃燕人张翼德，谁敢与我决一死战！曹军将领竟无一人敢上前，刘备得以顺利渡河。","outcome":"长坂坡是赵云忠勇形象的定格时刻，也是张飞胆气过人的标志性场面。刘备携民渡江的行为进一步巩固了其仁义之名，此后荆州归附的民心更加稳固。","participants":["zhaoyun","zhangfei","liubei","liuchan","caocao"]},{"id":"chibi","name":"赤壁之战","type":"event","year":"208年","location_id":"loc_chibi","background":"曹操得荆州后，水陆并进，大军号称八十万（实约二十余万）压境东吴。孙权朝堂上，以张昭为首的主降派占多数，鲁肃和周瑜力主抗战。诸葛亮出使东吴，舌战群儒，与周瑜共同坚定了孙权的抗战决心。","process":"周瑜任大都督，与程普率三万精兵西进。曹操水军多为北方旱鸭子，加之瘟疫流行，战力大减。庞统（演义）向曹操献连环计，建议用铁链连接战船以减少颠簸，曹操采纳，致使战船不能机动。黄盖向周瑜申请苦肉计：公瑾以小杖打我，我诈降曹操，以火船冲入敌阵。周瑜打了黄盖一顿，使其遍体是伤，黄盖遣人送降书于曹操，曹操信以为真。借东风之夜，东南风起，黄盖率火船十艘冲入曹操水寨，大火借风势蔓延，曹操大军水陆寨栅一齐烧着。曹操败走华容道，关羽守住华容道，念及旧恩将其义释。","outcome":"赤壁之战是三国最重要的战役，以不足三万的东吴军大败二十余万曹军，奠定了三分天下的格局。曹操退回北方后再未能大规模南征，中国历史就此走向南北对峙的新格局。","participants":["zhouyu","zhugeliang","sunquan","caocao","liubei","huanggai","pangtong","lushu","guanyu","zhangzhao"]},{"id":"guowuguan","name":"过五关斩六将","type":"event","year":"200年","location_id":"xu","background":"关羽在曹操处降汉后，得知刘备在袁绍处的消息，决意北上寻兄。按之前约定，曹操放行，但未及时通知沿途关卡，或有意为难。","process":"关羽带着刘备两位夫人踏上归途。第一关东岭关：守将孔秀索要通行文书，关羽无书，被拦截，斩孔秀而过。第二关洛阳：太守韩福预伏弓弩手，射中关羽战马，关羽提刀斩韩福、孟坦。第三关沂水关：守将卞喜设鸿门宴，普净和尚示警，关羽先发制人斩卞喜。第四关荥阳：太守王植密令部下放火，被胡班告知，关羽提刀上门斩王植。第五关滑州：守将秦琪自恃与袁绍有亲，阻拦关羽，被一刀斩杀。关羽五关连过、连斩六将，护着两位夫人到达黄河，终与刘备相聚。","outcome":"过五关斩六将是关羽忠义形象的集中体现：不顾生死、不贪富贵、千里护嫂、只为寻兄。历史上此事是否确有其事颇受质疑，但这一故事深入人心，成为忠义的最高象征。","participants":["guanyu","caocao","liubei"]},{"id":"hanzhong","name":"汉中之战","type":"event","year":"217-219年","location_id":"loc_hanzhong","background":"曹操得汉中后，刘备据益州，双方隔秦岭对峙。汉中是益州的门户，进可攻退可守，诸葛亮隆中对明确要求必须占据汉中。法正力劝刘备主动出击，争夺汉中。","process":"刘备亲率大军进攻汉中，曹操派夏侯渊、张郃坚守。关键一战：黄忠采纳法正的战术，趁夏侯渊援救张郃时，黄忠高呼杀上定军山，快马冲下，一刀斩杀夏侯渊。夏侯渊之死令曹操大震，亲率援军来援，双方在汉水相持。刘备居高临下，赵云打了一次著名的空营计——张翼德夺了曹军粮草，曹操率兵来追，赵云大开营门，偃旗息鼓，曹操疑有埋伏撤退，营中蜀兵突然擂鼓呐喊，曹军惊溃。法正频出奇谋，张飞宕渠之战设伏大败张郃。曹操最终放弃汉中，说了那句著名的鸡肋：食之无味，弃之可惜，最终北撤。","outcome":"刘备得汉中，自称汉中王，蜀汉集团达到鼎盛。同年关羽水淹七军，威震华夏，蜀汉两面形势一片大好。然而好景不长，关羽之死彻底打断了这一势头。","participants":["liubei","huangzhong","fazheng","zhangfei","zhaoyun","xiahouyuan","caocao","zhanghe"]},{"id":"shuiqishu","name":"水淹七军","type":"event","year":"219年","location_id":"fancheng","background":"关羽坐镇荆州期间，决定北伐以呼应汉中之战的胜利。攻打曹仁据守的樊城，曹仁死守，曹操派于禁率七军（约三万人）急援。","process":"秋雨连绵，汉水暴涨。关羽敏锐察觉时机，命士兵掘开汉水堤坝（也有说是利用天然洪水），水淹于禁七军。于禁无路可逃，率残部投降，此举令关羽大为不屑。猛将庞德抬棺上阵，誓死不降，即使部下都已投降，庞德仍坐在船上用弓箭射击，被生擒后拒绝下跪，被斩首。关羽威声大震，曹操许都震动，一度议迁都以避关羽锋芒。关羽乘胜收降荆州各郡，形势一片大好，却同时得罪了曹魏（威震华夏）和东吴（拒绝联姻）两方。","outcome":"水淹七军是关羽军事生涯的顶点，也是其命运的转折点。此后曹操与孙权秘密联合对付关羽，孙权命吕蒙袭取荆州，曹操令徐晃驰援樊城，关羽陷入南北两面夹击，走向末路。","participants":["guanyu","caoren","yujin","xuhuang","caocao","sunquan"]},{"id":"maicheng","name":"走麦城","type":"event","year":"219年","location_id":"loc_maicheng","background":"吕蒙白衣渡江，兵不血刃接管荆州各地。关羽后方失守，樊城又久攻不克，徐晃援军到来，前线进退两难。","process":"关羽得知荆州失守，急率残兵南撤。沿途所至，各城守将均已降吴，无处可去，只得退守麦城。麦城弹丸之地，兵少粮绝，派廖化突围求援于刘封、孟达，二人拒绝出兵。关羽在麦城等待援军，绝望中率残部二百余人向西北突围，在临沮山道被潘璋部将马忠率军截住，关羽父子（关羽与关平）均被生擒。孙权几度劝降，关羽宁死不屈，与关平一同被斩首。孙权将首级装入木匣送给曹操，曹操以诸侯礼将其厚葬于洛阳，孙权将其身躯厚葬于当阳，关羽首身异处，以侯礼下葬。","outcome":"关羽之死是三国历史最重要的转折点之一：蜀汉永久失去荆州，隆中对两路北伐的战略成为空谈；刘备悲痛之下执意伐吴，引发夷陵之战，蜀汉元气大伤，此后再无翻盘之机。","participants":["guanyu","guanping","lyumeng","sunquan","caocao","xuhuang","panchan"]},{"id":"yiling","name":"夷陵之战","type":"event","year":"221-222年","location_id":"loc_yiling","background":"关羽死后，刘备不顾诸葛亮、赵云等人劝阻，以为关羽报仇为名，称帝仅数月便亲率大军（号称七十万）东征东吴。孙权求和，刘备不允，任命陆逊为大都督。","process":"刘备军一路攻入东吴境内，势如破竹。陆逊采取坚守避战策略，各将领极为不满，认为陆逊胆怯，多次请战被拒。相持半年，刘备在崎岖山地沿江连营，营寨绵延七百余里。陆逊暗中观察，等待时机。夏季来临，刘备军士热不耐烦，多移营入山林间以图阴凉。陆逊抓住这一机会，命每军各持火把，于某夜同时点火，山风助势，蜀军七百里连营同时燃起，将士不知所措，四散逃命。刘备仓皇出逃，传说马跃石头撞出火花，百姓在岸边用泥土灭火（马谡之计），刘备才得以脱身，逃往白帝城。","outcome":"夷陵之战是三国三大战役之一，蜀汉主力几乎全灭，精兵猛将损失惨重，此后蜀汉无力主动大规模进攻，只能依靠诸葛亮以北伐为守。东吴虽胜，也因此战与蜀汉关系彻底破裂，两国重归于好又花了多年时间。","participants":["liubei","luxun","sunquan","guanxing","zhangbao","zhugeliang"]},{"id":"baidi","name":"白帝城托孤","type":"event","year":"223年","location_id":"loc_baidi","background":"夷陵大败后，刘备退守白帝城（今重庆奉节），积忧成疾，病势沉重。自知不久于人世，召丞相诸葛亮、尚书令李严等人入白帝城，托付后事。","process":"刘备对诸葛亮说：君才十倍于曹丕，必能安邦定国，终定大事。若嗣子（刘禅）可辅，则辅之；如其不才，君可自取。诸葛亮泪流满面，跪伏于地：臣安敢不竭股肱之力，效忠贞之节，继之以死乎！刘备又对刘禅说：汝与丞相从事，事之如父。随后又对诸葛亮等大臣说：朕已危笃，不能一一口传，书写遗诏，望卿等一同辅佐幼主。言毕，刘备握住诸葛亮手腕，薨于永安宫，时年63岁。","outcome":"白帝城托孤是三国演义中最动人的君臣情谊场景，千古传诵。刘备的话既是真情流露，也是对诸葛亮最后的政治约束——明说可以自取，实则把诸葛亮置于大义的枷锁之下，使其不得不鞠躬尽瘁。诸葛亮此后确实以此为念，终其一生忠于蜀汉。","participants":["liubei","zhugeliang","liuchan","liyan"]},{"id":"qinmeng","name":"七擒孟获","type":"event","year":"225年","location_id":"nanzhong","background":"刘备死后，南中（今云南贵州一带）少数民族首领孟获联合蛮王趁乱起兵，威胁蜀汉南方稳定，使北伐大计无法推进。诸葛亮亲率大军南征，采用马谡攻心为上、攻城为下的建议，决意通过心服口服彻底解决南中问题。","process":"第一次：蜀军大破蛮兵，生擒孟获，孟获不服，说不是真本领，诸葛亮当场释放。第二次：孟获请来藤甲兵，诸葛亮用火攻大破，再擒孟获，孟获仍不服。……七次之中，诸葛亮或智取、或火攻、或利用孟获阵营内部矛盾，每次擒住都当着蛮兵之面将孟获释放，让孟获回去重整旗鼓再战。第七次，孟获大败，跪地而拜：丞相天威，南人不复反矣！诸葛亮遂撤兵，不留军队驻守，任命当地首领自治，只收取贡赋。","outcome":"七擒孟获是诸葛亮政治智慧的最高体现：以德服人而非以力服人，使南中此后数十年安定，为诸葛亮北伐解除了后顾之忧。这一故事也成为中国历史上处理民族关系的经典案例。","participants":["zhugeliang","mashu"]},{"id":"jietingzhan","name":"街亭之战与空城计","type":"event","year":"228年","location_id":"jietin","background":"诸葛亮第一次北伐，声势浩大。陇右三郡（南安、天水、安定）望风归附，连曹魏大将姜维也被迫投降。形势一片大好，关键是守住街亭，切断魏军从关中驰援的通道。诸葛亮违众意任命马谡为街亭守将，王平副之。","process":"马谡到达街亭，不听王平切实可行的建议（当道下寨），执意在山上扎营，说置之死地而后生。王平反复劝谏无效，无奈率少量兵马在山下立营。张郃迅速切断山上马谡军的水源，然后纵火围攻，蜀军大乱，马谡丢下王平逃走，街亭失守。同时，司马懿率大军直扑诸葛亮驻扎的西城，西城只有文官和老弱，无一员武将。诸葛亮临危不乱，大开城门，命老兵洒扫街道，自己身着鹤氅，坐于城楼之上抚琴。司马懿见状疑有伏兵，不敢贸然进攻，引军撤退。（此事真实性历来争议，正史无明确记载）诸葛亮随即有序撤军，回到汉中后含泪斩马谡，自降三级，以示负责。","outcome":"街亭之战是诸葛亮北伐最可惜的失败，错在用人不当。此次北伐若成功，陇右在手，局面将截然不同。空城计则成为胆识和智谋的永恒典故，无论真实与否，都深入人心。","participants":["zhugeliang","mashu","wangping","simayui","zhanghe","weiyan","wanglang","jiangwei"]},{"id":"wuzhangyuan","name":"五丈原之战","type":"event","year":"234年","location_id":"loc_wuzhangyuan","background":"诸葛亮第六次北伐，这也是他最后一次北伐。率十万大军出斜谷，在五丈原渭水南岸屯田，意图长期坚守，打持久战。司马懿同样坚守渭北，拒不出战。","process":"双方相持百余日，诸葛亮多次挑战，司马懿坚守不出。诸葛亮派人送去女人衣裳，嘲讽司马懿畏战如妇人，司马懿不为所动，反问使者诸葛亮饮食睡眠如何，得知诸葛亮事必躬亲、饭量甚少，叹曰：亮将死矣。诸葛亮积劳成疾，自知时日无多，安排后事：以费祎、姜维等继任，嘱魏延断后，秘不发丧，从容退兵。诸葛亮病逝于五丈原军中，享年54岁。蜀军按诸葛亮遗命，抬出事先制好的诸葛亮木像摆在车上，有序撤退。司马懿追击见到木像，以为诈死，惊退，蜀军安然归汉中。百姓感叹：死诸葛吓跑活仲达。","outcome":"五丈原是诸葛亮鞠躬尽瘁的最后谢幕。他的死令蜀汉痛失支柱，此后姜维九伐中原，虽努力延续北伐，但已无法与诸葛亮时代相比。天下三分，时不我与，诸葛亮以一州之力对抗三分之二的天下，其坚持令千古动容。","participants":["zhugeliang","simayui","weiyan","yangyi","jiangwei","feiyi"]},{"id":"gaopingling","name":"高平陵政变","type":"event","year":"249年","location_id":"luoyang","background":"曹叡死后，曹爽与司马懿共同辅政。曹爽逐渐排挤司马懿，大权独揽。司马懿称病在家多年，曹爽以为其垂垂老矣，不足为虑，完全放松警惕。","process":"曹爽陪魏帝曹芳出城祭扫高平陵，皇帝和曹爽亲信尽在城外。司马懿立刻行动：以太后懿旨控制洛阳武库和城门，派人占领洛水浮桥，截断曹爽回城之路，上奏太后声讨曹爽罪状。曹爽的谋士桓范带着大司农印绶出城，建议曹爽以皇帝旗号号召天下兵马勤王，此策若行，司马懿未必能胜。然而曹爽犹豫不决，最终说了一句：我不失作富家翁。选择投降。司马懿随即翻脸，将曹爽全族处死，并株连其党羽，一夜之间曹魏权贵几乎被清洗一空。","outcome":"高平陵政变是三国历史的重大转折，司马懿一朝发难，曹魏大权从此落入司马氏手中。此后司马师、司马昭相继掌权，废皇帝、杀异己，曹魏名存实亡，西晋代魏已是迟早之事。","participants":["simayui","caoshuang","simashi","simazhao"]},{"id":"shuhan_mie","name":"蜀汉灭亡","type":"event","year":"263年","location_id":"chengdu","background":"司马昭掌权后决意灭蜀。此时蜀汉内政腐败，刘禅宠信宦官黄皓，姜维长期北伐消耗国力，国内怨声载道。司马昭任命钟会、邓艾分两路进攻。","process":"钟会率主力十余万在正面攻打汉中，姜维主动放弃汉中、剑阁以外各处，退守剑阁天险，钟会大军被挡于剑阁前进不得，粮草将尽，几欲退兵。此时奇迹出现：邓艾带三万精兵偷渡阴平，从无人踏足的700里险道（今甘肃文县一带）翻山越岭，绕过姜维防线。邓艾裹毡滚下山坡，士兵砍树为梯，一步步穿越绝境，突然出现在江油城下。江油守将马邈投降。邓艾兵临绵竹，诸葛瞻（诸葛亮之子）父子率军出战，拒绝投降，力战而死。成都震动，刘禅召集群臣商议，谯周力主投降，北地王刘湛力主死战，刘禅最终采纳谯周建议，反缚双手、乘素舆，出城向邓艾投降，蜀汉亡。","outcome":"蜀汉历二帝（刘备、刘禅）43年而亡。刘禅降魏后被迁往洛阳，封安乐公，某日司马昭宴请时问：颇思蜀否？刘禅答：此间乐，不思蜀。乐不思蜀之典故由此而来。邓艾灭蜀之功后遭钟会诬陷，被司马昭收押，在押送途中被杀，含冤而终。钟会随即联合姜维叛变，欲据蜀自立，为部下所杀，姜维同时遇难。","participants":["dengai","zhonghui","jiangwei","liuchan","simazhao","simashi"]},{"id":"taoyuan","name":"桃园三结义","type":"event","year":"184年","location_id":"zhuo","background":"黄巾起义爆发，朝廷招募义兵。刘备、关羽、张飞在涿郡相识，志同道合。","process":"三人在桃园结义，对天起誓：不求同年同月同日生，但求同年同月同日死。义结金兰后共同举义兵。","outcome":"桃园三结义成为中国文化中义气、忠诚的永恒象征。三人此后生死相依，共创蜀汉。","participants":["liubei","guanyu","zhangfei"]},{"id":"sha_dingyuan","name":"吕布弑丁原","type":"event","year":"189年","location_id":"luoyang","background":"丁原（吕布义父）与董卓争权，吕布为丁原义子，是丁原最重要的武将。","process":"董卓派人以金银财宝、赤兔宝马说服吕布，吕布夜间杀死义父丁原，投奔董卓，认董卓为义父。","outcome":"吕布易主，人称三姓家奴。董卓获得吕布武力支柱，权势大增。","participants":["lyubu","dongzhuo"]},{"id":"fengyi","name":"凤仪亭","type":"event","year":"192年","location_id":"luoyang","background":"连环计进行中，董卓发现貂蝉与吕布在凤仪亭私会，大怒。","process":"董卓掷戟刺吕布，吕布闪避，两人之间的矛盾彻底爆发。王允趁机劝说吕布：此时不动手，更待何时？","outcome":"凤仪亭事件是压倒骆驼的最后一根稻草，吕布决意诛杀董卓。","participants":["lyubu","diaochan","dongzhuo","wangyun"]},{"id":"ruichuan","name":"取益州","type":"event","year":"214年","location_id":"chengdu","background":"刘备入川协助刘璋防张鲁，暗中图取益州。庞统、法正筹划，张飞、赵云四路入川。","process":"庞统落凤坡遇难是巨大损失。刘备军围困雒城、成都，刘璋力竭投降。益州归蜀。","outcome":"刘备得益州，隆中对三分战略基本实现，蜀汉根基正式建立。","participants":["liubei","zhugeliang","pangtong","fazheng","zhangfei","zhaoyun","liuzhang"]},{"id":"hanmie","name":"汉朝灭亡","type":"event","year":"220年","location_id":"xu","background":"曹操死后，曹丕继位魏王。朝野氛围在其操控下完全倒向禅让。","process":"曹丕以献帝名义筑禅台，献帝无奈禅位。汉朝四百年江山就此终结，曹丕建立魏国，定都洛阳。同年刘备在成都称汉，孙权称吴王，三国正式鼎立。","outcome":"延续四百年的汉朝正式终结，三国时代全面展开。","participants":["caopi","han_xiandi","caocao"]},{"id":"wuguan","name":"赤壁后争荆州","type":"event","year":"209年","location_id":"jingzhou","background":"赤壁大胜后，孙权与刘备争夺荆州。","process":"刘备以借荆州名义占据南郡，孙权虽不满但因抗曹需要，暂允。鲁肃主张联刘，孙权同意孙尚香与刘备联姻。","outcome":"荆州归属问题埋下孙刘联盟破裂的种子，日后引发关羽败走麦城、夷陵之战一系列悲剧。","participants":["liubei","sunquan","lushu","zhouyu","guanyu"]},{"id":"luoyang","name":"洛阳","type":"location","description":"东汉都城，历史古都，三国乱世的起点","timeline":[{"year":"189年","event":"何进引董卓入京，东汉中央权威崩塌"},{"year":"190年","event":"董卓迁都长安，焚烧洛阳"},{"year":"220年后","event":"曹魏控制，逐渐恢复繁荣"}],"major_events":["shichang","dongzhuo_ru","cichuidongzhuo","fendong","gaopingling"],"related_chars":["dongzhuo","caocao","han_xiandi","lyubu","hejin"]},{"id":"changan","name":"长安","type":"location","description":"西汉旧都，董卓迁都后短暂成为政治中心","timeline":[{"year":"190年","event":"董卓迁都长安，焚烧旧都洛阳"},{"year":"192年","event":"王允、吕布诛杀董卓，随后李傕郭汜攻入"},{"year":"196年","event":"献帝东归，曹操迎至许都"}],"major_events":["sha_dongzhuo","fengyi","lianhuanji"],"related_chars":["dongzhuo","lyubu","wangyun","diaochan","han_xiandi"]},{"id":"xu","name":"许都/许昌","type":"location","description":"曹操挟天子后的政治中心，东汉名义上的首都","timeline":[{"year":"196年","event":"曹操迎汉献帝至此，挟天子令诸侯"},{"year":"200年","event":"煮酒论英雄，衣带诏事件"},{"year":"220年","event":"曹丕逼献帝禅让，魏国建立"}],"major_events":["xietian","zhujiu","yidaizao","hanmie"],"related_chars":["caocao","han_xiandi","liubei","xunyu"]},{"id":"loc_guandu","name":"官渡","type":"location","description":"官渡之战发生地，今河南中牟附近","timeline":[{"year":"200年","event":"曹操与袁绍决战，以少胜多，奠定统一北方基础"}],"major_events":["guandu"],"related_chars":["caocao","yuanshao"]},{"id":"loc_chibi","name":"赤壁","type":"location","description":"赤壁之战发生地，今湖北赤壁市，长江南岸","timeline":[{"year":"208年","event":"孙刘联军火烧曹操水军，三分天下格局由此奠定"}],"major_events":["chibi"],"related_chars":["zhouyu","zhugeliang","sunquan","caocao","liubei"]},{"id":"jingzhou","name":"荆州","type":"location","description":"三国最重要的战略枢纽，兵家必争之地","timeline":[{"year":"208年前","event":"刘表长期统治，保境安民"},{"year":"208年","event":"赤壁后孙刘瓜分荆州"},{"year":"219年","event":"吕蒙白衣渡江，东吴夺回全部荆州，关羽败死"}],"major_events":["chibi","maicheng","shuiqishu"],"related_chars":["guanyu","liubei","zhouyu","lyumeng","sunquan"]},{"id":"fancheng","name":"樊城/襄阳","type":"location","description":"荆州北部要塞，关羽北伐的目标","timeline":[{"year":"219年","event":"关羽水淹七军围困樊城，徐晃解围，关羽退走"}],"major_events":["shuiqishu"],"related_chars":["guanyu","caoren","yujin","xuhuang"]} jizhou","name":"冀州","type":"location","description":"袁绍根据地，黄巾起义主要爆发地","timeline":[{"year":"184年","event":"黄巾起义主战场"},{"year":"200年后","event":"曹操逐步吞并袁绍的冀州根据地"}],"major_events":["huangjin","guandu"],"related_chars":["yuanshao","caocao","zhangjiou"]},{"id":"xiapi","name":"下邳","type":"location","description":"吕布最后的据点，白门楼所在地","timeline":[{"year":"198年","event":"曹操刘备联合围攻，吕布被擒，白门楼被斩"}],"major_events":["baimen"],"related_chars":["lyubu","caocao","liubei","zhangfei"]},{"id":"loc_hulaoguan","name":"虎牢关","type":"location","description":"讨伐董卓联军与吕布大战之地","timeline":[{"year":"190年","event":"三英战吕布，关羽温酒斩华雄"}],"major_events":["hulaoguan"],"related_chars":["lyubu","guanyu","zhangfei","liubei","caocao"]},{"id":"dangyang","name":"当阳/长坂","type":"location","description":"长坂坡之战发生地","timeline":[{"year":"208年","event":"曹操追击刘备，赵云七进七出救出阿斗，张飞当阳桥断后"}],"major_events":["changban"],"related_chars":["liubei","zhaoyun","zhangfei","caocao"]},{"id":"ye","name":"邺城","type":"location","description":"曹操晚年的实际都城，曹魏重要政治中心","timeline":[{"year":"204年","event":"曹操攻克袁绍之子袁尚，邺城成为北方政治中心"}],"major_events":["guandu"],"related_chars":["caocao","caopi","caozhi"]},{"id":"tongguan","name":"潼关","type":"location","description":"关中要道，马超与曹操决战之地","timeline":[{"year":"211年","event":"马超与曹操潼关大战，曹操割须弃袍"}],"major_events":[],"related_chars":["machao","caocao","xuzhu"]},{"id":"nanzhong","name":"南中","type":"location","description":"西南蛮荒之地，七擒孟获之地，今云贵地区","timeline":[{"year":"225年","event":"诸葛亮七擒孟获，平定南中，确保蜀汉南方稳定"}],"major_events":["qinmeng"],"related_chars":["zhugeliang"]},{"id":"loc_baidi","name":"白帝城","type":"location","description":"刘备驾崩处，托孤之地，今重庆奉节","timeline":[{"year":"222年","event":"夷陵惨败后，刘备退守于此"},{"year":"223年","event":"刘备白帝城托孤，含恨而终"}],"major_events":["baidi"],"related_chars":["liubei","zhugeliang","liuchan"]},{"id":"loc_yiling","name":"夷陵","type":"location","description":"夷陵之战发生地，陆逊火烧连营之处","timeline":[{"year":"221-222年","event":"刘备东征，陆逊火烧七百里连营，蜀军大溃"}],"major_events":["yiling"],"related_chars":["liubei","luxun","sunquan"]},{"id":"luofengpo","name":"落凤坡","type":"location","description":"庞统中箭身亡之地，今四川德阳附近","timeline":[{"year":"214年","event":"庞统入川途中在此中伏箭身亡，英年早逝"}],"major_events":["ruichuan"],"related_chars":["pangtong","liubei"]},{"id":"lijue_chaos","name":"李傕郭汜之乱","type":"event","year":"192年","location_id":"changan","background":"董卓死后，其部将李傕、郭汜在谋士贾诩的建议下，拒不解散军队，反率凉州兵马杀回长安。王允拒绝赦免，导致双方兵戎相见。","process":"李傕、郭汜合兵攻打长安，吕布寡不敌众，出走关东。王允被杀，汉献帝落入李傕之手。此后李傕、郭汜二人相互攻伐，长安城中烽火连天，百姓流离失所，朝廷形同虚设。","outcome":"长安陷入长达数年的军阀混战，东汉朝廷威信扫地。贾诩因献计有功而受李傕重用，但深感局势危险，逐渐疏远。","participants":["jiaxu","han_xiandi","wangyun","lyubu"]},{"id":"xiandi_donggui","name":"汉帝东归洛阳","type":"event","year":"195年","location_id":"luoyang","background":"李傕郭汜内讧，汉献帝趁机出逃长安，欲东归旧都洛阳。沿途各路军阀既无人真心护驾，又互相倾轧，皇帝一行人衣食无着，狼狈不堪。","process":"汉献帝一行历经艰辛，渡黄河，抵洛阳，发现故都已成废墟。百官以野果充饥，朝堂在残垣断壁间苟延。各地诸侯皆观望不前，无人愿意承担奉迎天子的政治风险。","outcome":"曹操察觉到挟天子以令诸侯的巨大政治价值，力排众议，亲率大军迎献帝东迁许昌，由此奠定了其日后称雄北方的政治基础。","participants":["han_xiandi","caocao","xunyu","chengyu"]},{"id":"cao_ping_hebei","name":"曹操平定河北","type":"event","year":"202年—207年","location_id":"ye","background":"官渡之战后，袁绍愧恨发病而死，其子袁谭、袁尚兄弟为争夺继承权大打出手，给了曹操各个击破的机会。","process":"曹操先助袁谭破袁尚，取冀州；后灭袁谭，克青州；再克邺城，袁尚、袁熙北逃投奔辽东乌桓。207年，曹操亲征乌桓，于白狼山一战大破乌桓，斩蹋顿单于，袁尚、袁熙为辽东太守公孙康所杀，首级送至曹营。郭嘉在此役后病逝于归途。","outcome":"曹操统一北方，黄河流域尽入其手。河北人口、粮食、铁器资源成为曹魏日后争霸的根基。郭嘉之死令曹操深痛惋惜，日后曹操曾感叹奉孝若在，定能助我完成大业。","participants":["caocao","yuanshao","guojia","xiahouyuan"]},{"id":"liubei_jiejing","name":"刘备借荆州","type":"event","year":"210年","location_id":"jingzhou","background":"赤壁之战后，荆州成为各方争夺的焦点。刘备依附于孙权，屯兵公安。鲁肃建议孙权将南郡（荆州核心地区）借给刘备，以使其抵御曹操。","process":"刘备亲赴京口（今镇江）拜见孙权，凭借鲁肃的斡旋，取得南郡借用权。此后刘备将治所迁至江陵，以荆州为根基，大力招募人才，扩充兵员，同时着手谋划进取益州的计划。","outcome":"荆州之借成为日后孙刘联盟裂痕的根源。东吴此后多次讨要归还，刘备以益州未定为由一再拖延，最终酿成关羽失荆州的悲剧。","participants":["liubei","sunquan","lushu","zhouyu"]},{"id":"zhouyu_si","name":"周瑜病逝巴丘","type":"event","year":"210年","location_id":"jingzhou","background":"赤壁之战后，周瑜力主进取益州，亲自率兵取南郡，身中曹仁军箭矢，伤势反复难愈。其后制定西进益州计划，向孙权请命。","process":"周瑜在西征途中病情加剧，行至巴丘（今岳阳）时病重不治，年仅三十六岁。临终前上书孙权，力荐鲁肃接任都督，并叮嘱联刘抗曹的大局。","outcome":"周瑜之死是东吴的重大损失，也改变了孙刘之间的战略格局。鲁肃接任后，主张维持孙刘联盟，对刘备的荆州问题采取相对温和的立场。","participants":["zhouyu","sunquan","lushu","lyumeng"]},{"id":"liubei_qushu","name":"刘备取益州","type":"event","year":"211年—214年","location_id":"chengdu","background":"诸葛亮隆中对早已指出益州为建立帝业的战略基地。211年，益州牧刘璋受张松、法正等人劝说，邀请刘备入川抵御张鲁，给了刘备进入益州的机会。","process":"刘备率部入川，初期与刘璋表面和好。212年，刘备以北伐曹操为名调兵，张松事泄被杀，双方翻脸。庞统随军出谋，却在雒城外落凤坡中流矢身亡。刘备急调诸葛亮、张飞、赵云入川支援，三路合围成都。214年，刘璋开城投降。","outcome":"刘备取得益州，隆中对三分天下构想的基础已然成形。庞统之死令刘备痛失臂膀，诸葛亮此后更成为不可替代的核心谋主。","participants":["liubei","zhugeliang","pangtong","fazheng","zhangfei","zhaoyun"]},{"id":"hefei_zhan","name":"合肥之战","type":"event","year":"215年","location_id":"jianye","background":"215年，孙权趁曹操远征汉中之际，亲率十万大军进攻合肥。合肥是曹魏在东线的战略要地，守将张辽手下不足万人。","process":"张辽判断孙权大军初至士气未稳，主动出城突击。他率八百精兵冲击吴军中军，直杀至孙权旗帜之下，令吴军大乱。吴军随后围城，张辽凭借坚守挫敌锐气。孙权撤退时，张辽再度出击追杀，吴军死伤惨重，史称八百破十万。","outcome":"此役极大振奋了曹魏士气，张辽威名传遍江东，民间甚至以张辽来了吓止小儿啼哭。孙权此后多次进攻合肥，皆无功而返，合肥成为东吴难以逾越的屏障。","participants":["zhanglio","sunquan","lyumeng","lushu"]},{"id":"xiangshui_huajie","name":"湘水划界","type":"event","year":"215年","location_id":"jingzhou","background":"刘备取益州后，孙权索还荆州，刘备以益州未定为由拒绝。孙权大怒，派吕蒙袭取长沙、零陵、桂阳三郡。刘备亲率五万兵马自益州东下，与孙权对峙于公安。","process":"双方剑拔弩张之际，传来曹操进军汉中的消息。刘备意识到两面受敌的危险，孙权也不愿因荆州与刘备彻底决裂而使曹操坐收渔利。双方通过鲁肃斡旋，以湘水为界：荆州东部（长沙、江夏、桂阳）归吴，西部（南郡、零陵、武陵）归刘。","outcome":"湘水之盟暂时缓和了孙刘矛盾，但根本问题并未解决。荆州的分割状态为日后吕蒙偷袭创造了条件，孙刘联盟已从内部出现裂痕。","participants":["liubei","sunquan","lushu","lyumeng","guanyu"]},{"id":"cao_cao_si","name":"曹操病逝洛阳","type":"event","year":"220年","location_id":"luoyang","background":"汉中之战失败、关羽北伐威震华夏之际，曹操已年迈多病。220年正月，曹操在洛阳病重，头风痼疾发作，回天乏术。","process":"曹操临终前已立曹丕为魏王太子，并安排荀彧、贾诩等辅政大臣。他在生命最后阶段仍关注军政，嘱咐诸将持重勿轻进，并留下遗令要求薄葬，不封土，不植树，遗孀可再嫁。","outcome":"曹操以魏王身份去世，从未称帝，却实际掌控汉室数十年。其死为曹丕正式篡汉清除了最后的顾虑。曹操横扫北方、统一中原的功业，奠定了三国鼎立的历史格局，是三国时代最具影响力的人物之一。","participants":["caocao","caopi","jiaxu","simayui"]},{"id":"caowei_jianguo","name":"曹丕称帝建魏","type":"event","year":"220年","location_id":"ye","background":"曹操去世后，曹丕继承魏王之位，在文臣武将的拥戴和劝进之下，着手完成父亲未竟的篡汉之业。","process":"曹丕在群臣三度劝进后，接受汉献帝的禅让，于220年十月登基称帝，国号魏，定都洛阳，年号黄初。汉献帝被封为山阳公，东汉王朝正式覆灭。","outcome":"曹丕建立魏国，标志着三国时代正式开始。刘备随即以汉室宗亲身份在成都称帝，建立蜀汉；孙权则暂时向曹丕称臣，等待时机。三分天下的格局由此法理化。","participants":["caopi","han_xiandi","simayui","jiaxu"]},{"id":"liubei_chengdi","name":"刘备称帝建蜀汉","type":"event","year":"221年","location_id":"chengdu","background":"曹丕称帝、汉朝覆灭的消息传至益州，刘备群臣纷纷上书，认为汉室正统须由刘备延续，不可令神器断绝。","process":"221年四月，刘备在成都武担山设坛，即皇帝位，国号汉（史称蜀汉），年号章武。封诸葛亮为丞相，张飞为车骑将军，赵云为翊军将军。随即宣布伐吴，为关羽复仇。","outcome":"蜀汉正式建立，三国鼎立格局完成。刘备以延续汉室为旗帜，在道义上与曹魏形成对立。然而他急于为关羽报仇，不顾诸葛亮、赵云的劝阻，执意东征，为彝陵惨败埋下伏笔。","participants":["liubei","zhugeliang","zhangfei","zhaoyun"]},{"id":"liuchan_jicheng","name":"刘禅继位与诸葛亮辅政","type":"event","year":"223年","location_id":"chengdu","background":"彝陵惨败后，刘备忧愤成疾，病重于白帝城。他深知自己时日无多，召诸葛亮入托孤，留下三国史上著名的君臣托付。","process":"刘备对诸葛亮说：君才十倍曹丕，必能安国，终定大事。若嗣子可辅，辅之；如其不才，君可自取。诸葛亮涕泣受命，誓以丞相之位辅佐后主刘禅。刘禅继位后，诸葛亮开府治事，实际掌握蜀汉军政大权。","outcome":"诸葛亮辅政十余年，厉行法治，整顿吏治，平定南中，积蓄北伐实力。他以鞠躬尽瘁，死而后已的精神成为中国历史上忠臣贤相的代名词。刘禅虽能力平庸，但在诸葛亮生前尚能信任依赖。","participants":["liuchan","zhugeliang","liubei","liyan"]},{"id":"sunquan_chengdi","name":"孙权称帝建吴","type":"event","year":"229年","location_id":"jianye","background":"曹丕称帝后，孙权一度向魏称臣以自保，被封为吴王。彝陵之战后孙刘重新结盟，孙权不再依附魏国。曹丕、曹叡相继即位，孙权逐渐积累称帝的政治资本。","process":"229年，孙权在武昌（今鄂州）登基称帝，国号吴，年号黄龙。此后迁都建业（今南京）。孙权同时遣使蜀汉，与诸葛亮商定平分天下、共灭曹魏的盟约。","outcome":"东吴正式建国，三国鼎立格局最终确立。孙权在位期间推进江东开发，任用陆逊等人才，使东吴成为三国中最后灭亡的国家（280年灭于晋）。","participants":["sunquan","luxun","lyumeng","lushu"]},{"id":"beifa_xu","name":"诸葛亮多次北伐","type":"event","year":"229年—234年","location_id":"loc_hanzhong","background":"街亭失利后，诸葛亮挥泪斩马谡，自贬三级。但他深知蜀汉国力有限，若不趁早进攻，坐等魏国坐大，蜀汉将永无胜算，因此继续坚持北伐。","process":"诸葛亮又发动四次北伐：229年出陈仓、231年再出祁山（以木牛流马运粮，射杀张郃）、232年小规模出兵骚扰魏境、234年第六次北伐屯兵五丈原。魏国以司马懿坚守不出应对，双方形成长期对峙。","outcome":"诸葛亮六出祁山虽未能攻下关中，但有效地牵制魏国，保持了蜀汉的战略主动。射杀张郃是蜀汉难得的重大胜利。最终诸葛亮在五丈原积劳成疾，积病而终，北伐大业功败垂成。","participants":["zhugeliang","simayui","mashu","wangping","zhanghe","weiyan"]},{"id":"jiangwei_beifa","name":"姜维继志北伐","type":"event","year":"238年—262年","location_id":"loc_hanzhong","background":"诸葛亮死后，蒋琬、费祎相继辅政，对北伐持审慎态度，控制出兵规模。费祎遇刺身亡（253年）后，姜维大权在握，开始大规模北伐。","process":"姜维一生共发动十一次北伐，进出祁山、陇右，时有小胜，但始终未能突破魏国防线。魏国名将邓艾、陈泰等针锋相对，数度挫败姜维。蜀汉朝中宦官黄皓弄权，主张防守的廖化、董厥与姜维政见不合，北伐内耗加剧。","outcome":"连年征战令蜀汉国力大损，史书记载蜀汉后期民皆菜色。姜维虽忠勇，却无力回天。263年魏国大举伐蜀，蜀汉在内外交困中迅速崩溃。","participants":["jiangwei","liuchan","weiyan","liaohua","dengai"]},{"id":"caomao_pi","name":"曹髦之死与司马昭专权","type":"event","year":"260年","location_id":"luoyang","background":"高平陵之变后，司马氏全面掌控曹魏朝政。司马师废皇帝曹芳，立曹髦。曹髦年轻气盛，不甘做傀儡，视司马昭为心腹大患。","process":"260年，曹髦亲率宫中僮仆数百人，持刀冲出宫门，高呼司马昭之心，路人所知也，欲直取司马昭。司马昭部将成济当街弑杀皇帝，此为中国历史上罕见的公然弑君事件。","outcome":"司马昭令成济伏法以平众怒，另立曹奂为帝。司马昭之心，路人皆知成为千古名句，形容权臣狼子野心昭然若揭。司马昭随后获封晋公、晋王，晋代魏已是不可逆的历史趋势。","participants":["simazhao","simashi","caopi"]},{"id":"deng_ai_toushu","name":"邓艾偷渡阴平","type":"event","year":"263年","location_id":"chengdu","background":"263年，司马昭发兵十八万分三路伐蜀：钟会率主力攻汉中，牵制姜维；邓艾率偏师从阴平小道突袭蜀汉腹地。","process":"邓艾率军越过七百余里人迹罕至的阴平山道，以毡裹身滚下峭壁，克服重重险阻，出其不意地出现在江油关下。江油守将马邈开城投降。邓艾随即挥师南下，在绵竹大破蜀汉卫将军诸葛瞻父子，两人以身殉国。","outcome":"邓艾兵临成都城下，蜀汉腹地震动。诸葛瞻战死是蜀汉最后的抵抗。刘禅在谯周等人的劝说下，决定开城投降，结束蜀汉四十三年的历史。邓艾之奇谋被誉为三国末期最精彩的军事冒险。","participants":["dengai","zhonghui","jiangwei","liuchan"]},{"id":"simajin_jianguo","name":"西晋建立，三国终结","type":"event","year":"265年","location_id":"luoyang","background":"蜀汉灭亡后，司马昭加紧筹备代魏建晋。265年，司马昭病逝，其子司马炎继承晋王之位，随即完成了最后一步。","process":"265年，司马炎逼魏元帝曹奂禅让，建立晋朝，史称西晋，年号泰始，定都洛阳。280年，西晋再灭东吴，三国时代彻底终结，中国重归统一。","outcome":"西晋统一是三国割据近百年后的历史总结，但好景不长，晋武帝死后八王之乱爆发，随即引发五胡乱华，中原再度陷入大分裂时代。三国的英雄时代，就此画上了句点，留下无数千古传唱的故事。","participants":["simazhao","jiangwei","luxun","liuchan"]}],"links":[{"source":"liubei","target":"guanyu","rel":"义兄弟","color":"#aaa"},{"source":"liubei","target":"zhangfei","rel":"义兄弟","color":"#aaa"},{"source":"liubei","target":"zhugeliang","rel":"君臣知己","color":"#aaa"},{"source":"liubei","target":"zhaoyun","rel":"君臣","color":"#aaa"},{"source":"liubei","target":"lyubu","rel":"曾被庇护/后落井下石","color":"#aaa"},{"source":"liubei","target":"caocao","rel":"政敌/相互欣赏","color":"#aaa"},{"source":"liubei","target":"liuchan","rel":"父子","color":"#aaa"},{"source":"guanyu","target":"liubei","rel":"义弟","color":"#aaa"},{"sourc // ── Sidebar list ──────────────────────────────────────────────────────────
function renderList(){
  const container=document.getElementById("list-container");
  const q=currentSearch.toLowerCase();
  const items=RAW.nodes.filter(n=>{
    if(n.type!==currentSideTab) return false;
    if(q&&!n.name.includes(currentSearch)&&!(n.title||"").includes(currentSearch)) return false;
    if(currentSideTab==="character"&&currentFaction!=="all"){
      if(n.faction!==currentFaction&&!(currentFaction==="其他"&&(n.faction==="汉室"||n.faction==="其他"||!FACTION_COLOR[n.faction]))) return false;
    }
    return true;
  });
  if(currentSideTab==="event"){
    items.sort((a,b)=>(EVENT_ORDER[a.id]||99)-(EVENT_ORDER[b.id]||99));
  } else {
    items.sort((a,b)=>a.name.localeCompare(b.name,"zh"));
  }
  container.innerHTML=items.map(n=>`
    <div class="list-item${n.id===selectedId?" selected":""}" onclick="selectNode('${n.id}')">
      <div class="list-dot" style="background:${nodeColor(n)}"></div>
      <span class="list-name">${n.name}</span>
      <span class="list-sub">${n.faction||n.year||""}</span>
    </div>`).join("");
}

function setSideTab(t){
  currentSideTab=t;
  document.querySelectorAll(".side-tab").forEach((b,i)=>{
    b.classList.toggle("active",["character","event"][i]===t);
  });
  renderList();
  const isMap=(t==="event");
  document.getElementById("map-view").classList.toggle("map-on",isMap);
  document.getElementById("graph-svg").style.display=isMap?"none":"";
  document.body.classList.toggle("map-mode",isMap);
  if(isMap){
    if(!mapInited){initMap();initTimeline();mapInited=true;}
    else if(lmap){setTimeout(()=>lmap.invalidateSize(),100);}
    if(mapCurrentSeq===-1) setMapSeq(-1);
  }
}

function filterFaction(t){
  currentFaction=t;
  const _f=["all","蜀汉","曹魏","东吴","其他"];
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active",_f[i]===t));
  document.querySelectorAll("#mob-faction-row .mob-btn").forEach((b,i)=>b.classList.toggle("active",_f[i]===t));
  renderList();
  updateGraph();
}
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("mob-overlay").classList.toggle("open");
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("mob-overlay").classList.remove("open");
}

document.getElementById("search").addEventListener("input",e=>{
  currentSearch=e.target.value;
  renderList();
  updateGraph();
});

function closeWiki(){

  renderList();
  const rb=document.getElementById("mob-wiki-restore-btn");
