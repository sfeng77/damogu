function link(id){
  const n=nodeMap[id];
  if(!n) return id;
  return `<a class="wiki-link" onclick="selectNode('${id}')">${n.name}</a>`;
}

function showWiki(n){
  const wikiEl=document.getElementById("wiki");
  wikiEl.style.display="flex";
  wikiEl.style.flexDirection="column";
  wikiEl.classList.remove("wiki-min");
  wikiEl.classList.add("mob-open");
  const rb=document.getElementById('mob-wiki-restore-btn');
  if(rb) rb.style.display='none';
  let html=`<div class="wiki-title">${n.name}</div>`;
  html+=`<div class="wiki-meta">`;
  if(n.type==="character"){
    const fc=FACTION_COLOR[n.faction]||"#a78bfa";
    html+=`<span class="wiki-tag" style="background:${fc}22;color:${fc};border:1px solid ${fc}44">${n.faction||""}</span>`;
    if(n.title) html+=`<span>${n.title}</span>`;
    if(n.born||n.died) html+=`<span>${n.born||"?"}—${n.died||"?"}</span>`;
  } else if(n.type==="event"){
    html+=`<span class="wiki-tag" style="background:#431407;color:#fb923c">历史事件</span>`;
    if(n.year) html+=`<span>📅 ${n.year}</span>`;
    if(n.location_id&&nodeMap[n.location_id]) html+=`<span>📍${link(n.location_id)}</span>`;
  } else {
    html+=`<span class="wiki-tag" style="background:#064e3b;color:#34d399">地点</span>`;
  }
  html+=`</div>`;

  if(n.type==="character"){
    html+=`<div class="wiki-section"><h3>简介</h3><p class="wiki-bio">${n.bio||""}</p></div>`;
    if(n.timeline&&n.timeline.length){
      html+=`<div class="wiki-section"><h3>生平事迹</h3><ul class="wiki-timeline">`;
      n.timeline.forEach(t=>{
        const eNode=t.event_id&&nodeMap[t.event_id];
        const lNode=t.location_id&&nodeMap[t.location_id];
        html+=`<li><span class="tl-year">${t.year||""}</span><div class="tl-desc">`;
        if(eNode) html+=`<a class="wiki-link" onclick="selectNode('${t.event_id}')">[${eNode.name}]</a> `;
        if(lNode) html+=`<span style="color:#34d399">📍${link(t.location_id)}</span><br>`;
        html+=`${t.desc}</div></li>`;
      });
      html+=`</ul></div>`;
    }
    if(n.relations&&n.relations.length){
      html+=`<div class="wiki-section"><h3>人物关系</h3><div class="rel-grid">`;
      n.relations.forEach(r=>{
        const rn=nodeMap[r.target_id];
        if(!rn) return;
        html+=`<div class="rel-item">`;
        html+=`<span class="rel-name" onclick="selectNode('${r.target_id}')">${rn.name}</span>`;
        html+=`<span class="rel-type">[${r.rel}]</span>`;
        html+=`<div class="rel-desc">${r.desc||""}</div></div>`;
      });
      html+=`</div></div>`;
    }
  } else if(n.type==="event"){
    if(n.background) html+=`<div class="wiki-section"><h3>背景</h3><p class="wiki-bio">${n.background}</p></div>`;
    if(n.process) html+=`<div class="wiki-section"><h3>经过</h3><p class="wiki-bio">${n.process}</p></div>`;
    if(n.outcome) html+=`<div class="wiki-section"><h3>影响与意义</h3><p class="wiki-bio">${n.outcome}</p></div>`;
    if(n.participants&&n.participants.length){
      const validPs=n.participants.filter(pid=>nodeMap[pid]);
      if(validPs.length){
        html+=`<div class="wiki-section"><h3>参与人物</h3><div class="participant-list">`;
        validPs.forEach(pid=>{
          const pn=nodeMap[pid];
          html+=`<span class="ptag" onclick="selectNode('${pid}')">${pn.name}</span>`;
        });
        html+=`</div></div>`;
      }
    }
  } else {
    html+=`<div class="wiki-section"><h3>简介</h3><p class="wiki-bio">${n.description||""}</p></div>`;
    if(n.timeline&&n.timeline.length){
      html+=`<div class="wiki-section"><h3>历史沿革</h3><ul class="wiki-timeline">`;
      n.timeline.forEach(t=>{
        html+=`<li><span class="tl-year">${t.year}</span><div class="tl-desc">${t.event}</div></li>`;
      });
      html+=`</ul></div>`;
    }
    if(n.major_events&&n.major_events.length){
      const validEvs=n.major_events.filter(eid=>nodeMap[eid]);
      if(validEvs.length){
        html+=`<div class="wiki-section"><h3>重大事件</h3><div class="loc-event-list">`;
        validEvs.forEach(eid=>{
          const en=nodeMap[eid];
          html+=`<div class="loc-event-item"><div class="loc-event-year">${en.year||""}</div><a class="wiki-link" onclick="selectNode('${eid}')">${en.name}</a></div>`;
        });
        html+=`</div></div>`;
      }
    }
    if(n.related_chars&&n.related_chars.length){
      const validCs=n.related_chars.filter(cid=>nodeMap[cid]);
      if(validCs.length){
        html+=`<div class="wiki-section"><h3>相关人物</h3><div class="participant-list">`;
        validCs.forEach(cid=>{
          const cn=nodeMap[cid];
          html+=`<span class="ptag" onclick="selectNode('${cid}')">${cn.name}</span>`;
        });
        html+=`</div></div>`;
      }
    }
  }

  // Prev/next navigation for events
  if(n.type==="event"){
    const evtList=RAW.nodes.filter(x=>x.type==="event")
      .sort((a,b)=>(EVENT_ORDER[a.id]||99)-(EVENT_ORDER[b.id]||99));
    const idx=evtList.findIndex(e=>e.id===n.id);
    const prev=idx>0?evtList[idx-1]:null;
    const next=idx<evtList.length-1?evtList[idx+1]:null;
    html+=`<div id="evt-nav">`;
    html+=prev?`<button class="evt-nav-btn prev" onclick="selectNode('${prev.id}')" title="${prev.name}">${prev.name}</button>`:`<span></span>`;
    html+=next?`<button class="evt-nav-btn next" onclick="selectNode('${next.id}')" title="${next.name}">${next.name}</button>`:`<span></span>`;
    html+=`</div>`;
  }

  document.getElementById("wiki-content").innerHTML=html;
  document.getElementById("wiki").scrollTop=0;
  // On mobile: after wiki slides up, re-center map on selected event
  if(window.innerWidth<=768 && document.body.classList.contains('map-mode') && mapCurrentSeq!==-1){
    setTimeout(()=>{
      const curM=Object.values(lmarkers).find(m=>m.seq===mapCurrentSeq);
      if(curM) panToVisible(curM.lat,curM.lon);
    },120);
  }
}

// ── D3 graph (character nodes only, faction-filtered) ────────────────────
const svg=d3.select("#graph-svg");
const g=svg.append("g");
let simulation;
let transform=d3.zoomIdentity;

const zoom=d3.zoom().scaleExtent([.1,4]).on("zoom",e=>{
  transform=e.transform;
  g.attr("transform",e.transform);
});
svg.call(zoom);

function resetGraph(){
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
}

function visibleNodes(){
  const q=currentSearch.toLowerCase();
  return RAW.nodes.filter(n=>{
    if(n.type!=="character") return false;
    if(currentFaction!=="all"){
      if(currentFaction==="其他"){
        if(n.faction==="蜀汉"||n.faction==="曹魏"||n.faction==="东吴") return false;
      } else {
        if(n.faction!==currentFaction) return false;
      }
    }
    if(q&&!n.name.includes(currentSearch)) return false;
    return true;
  });
}

function updateGraph(){
  const vNodes=visibleNodes();
  const vIds=new Set(vNodes.map(n=>n.id));
  const vLinks=RAW.links.filter(l=>{
    const s=l.source.id||l.source, t=l.target.id||l.target;
    return vIds.has(s)&&vIds.has(t);
  });

  if(simulation) simulation.stop();

  const w=document.getElementById("graph-area").clientWidth;
  const h=document.getElementById("graph-area").clientHeight;

  simulation=d3.forceSimulation(vNodes)
    .force("link",d3.forceLink(vLinks).id(d=>d.id).distance(80).strength(.3))
    .force("charge",d3.forceManyBody().strength(-200))
    .force("center",d3.forceCenter(w/2,h/2))
    .force("collision",d3.forceCollide().radius(d=>nodeRadius(d)+8));

  g.selectAll("*").remove();

  const linkSel=g.append("g").selectAll("line").data(vLinks).join("line")
    .attr("class","link-line")
    .attr("stroke","#334155")
    .attr("stroke-width",1);

  const nodeG=g.append("g").selectAll("g").data(vNodes).join("g")
    .attr("class","node-circle")
    .call(d3.drag()
      .on("start",(e,d)=>{if(!e.active)simulation.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on("end",(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}))
    .on("click",(e,d)=>{e.stopPropagation();selectNode(d.id)})
    .on("mouseover",(e,d)=>{
      const tt=document.getElementById("tooltip");
      tt.style.display="block";
      tt.innerHTML=`<b>${d.name}</b><br><span style="color:#94a3b8;font-size:11px">${d.title||d.faction||""}</span>`;
    })
    .on("mousemove",e=>{
      const tt=document.getElementById("tooltip");
      const rect=document.getElementById("graph-area").getBoundingClientRect();
      tt.style.left=(e.clientX-rect.left+14)+"px";
      tt.style.top=(e.clientY-rect.top-10)+"px";
    })
    .on("mouseout",()=>{document.getElementById("tooltip").style.display="none"});

  nodeG.append("circle")
    .attr("r",d=>nodeRadius(d))
    .attr("fill",d=>nodeColor(d))
    .attr("stroke",d=>d.id===selectedId?"#fff":"rgba(255,255,255,0.15)")
    .attr("stroke-width",d=>d.id===selectedId?2.5:1);

  nodeG.append("text")
    .attr("class","node-label")
    .attr("dy","22px")
    .text(d=>d.name);

  simulation.on("tick",()=>{
    linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
           .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeG.attr("transform",d=>`translate(${d.x},${d.y})`);
  });
}

function selectNode(id){
  selectedId=id;
  const n=nodeMap[id];
  if(!n) return;
  showWiki(n);
  // switch sidebar tab to match
  if(n.type!==currentSideTab){ setSideTab(n.type); } else { renderList(); }
  // highlight in graph
  g.selectAll("circle")
    .attr("stroke",d=>d.id===id?"#fff":"rgba(255,255,255,0.15)")
    .attr("stroke-width",d=>d.id===id?2.5:1);
  // center on node (account for wiki panel on mobile)
  const node=RAW.nodes.find(nd=>nd.id===id);
  if(node&&node.x!==undefined){
    const w=document.getElementById("graph-area").clientWidth;
    const h=document.getElementById("graph-area").clientHeight;
    const mob=window.innerWidth<=768;
    const wikiOpen=document.getElementById("wiki").classList.contains("mob-open");
    const wikiH=mob&&wikiOpen?window.innerHeight*0.72:0;
    const effectiveH=h-wikiH;
    const scale=transform.k||1;
    svg.transition().duration(500).call(
      zoom.transform,
      d3.zoomIdentity.translate(w/2-node.x*scale,effectiveH/2-node.y*scale).scale(scale)
    );
  }
}

// ── Mobile-aware helpers ─────────────────────────────────────────────────────
// Pan Leaflet map so [lat,lon] appears centered in the visible area above wiki panel
function panToVisible(lat, lon){
  if(!lmap) return;
  const mob=window.innerWidth<=768;
  const wikiOpen=document.getElementById('wiki').classList.contains('mob-open');
  const wikiH=mob&&wikiOpen ? window.innerHeight*0.72 : 0;
  if(wikiH>0){
    // Shift map so target lands at center of visible (non-covered) area
    const mapH=lmap.getSize().y;
    const visCenter=(mapH-wikiH)/2;
    const curPt=lmap.latLngToContainerPoint([lat,lon]);
    const delta=curPt.y-visCenter;
    if(Math.abs(delta)>25) lmap.panBy([0,delta],{animate:true,duration:0.4});
  } else if(mob){
    lmap.panTo([lat,lon],{animate:true,duration:0.5});
  } else {
    if(!lmap.getBounds().contains([lat,lon]))
      lmap.panTo([lat,lon],{animate:true,duration:0.5});
  }
}

// ════════════════════ MAP + TIMELINE (Leaflet) ════════════════════
let mapInited=false, mapCurrentSeq=-1, lmap=null;
const lmarkers={};  // evtId → {outer, inner, lat, lon, seq}
const tlEvts=[];    // sorted event nodes

const LOC_COORDS={
  'zhuo':            {lat:39.5,  lon:115.9},
  'jizhou':          {lat:37.8,  lon:115.4},
  'ye':              {lat:36.3,  lon:114.4},
  'luoyang':         {lat:34.7,  lon:112.4},
  'loc_hulaoguan':   {lat:34.9,  lon:113.1},
  'loc_guandu':      {lat:34.8,  lon:113.7},
  'xu':              {lat:34.0,  lon:113.8},
  'changan':         {lat:34.3,  lon:108.9},
  'tongguan':        {lat:34.5,  lon:110.2},
  'longzhong':       {lat:32.1,  lon:112.2},
  'xiapi':           {lat:34.3,  lon:117.9},
  'jingzhou':        {lat:30.4,  lon:112.1},
  'fancheng':        {lat:32.1,  lon:112.1},
  'dangyang':        {lat:30.7,  lon:111.8},
  'loc_maicheng':    {lat:30.5,  lon:111.3},
  'loc_chibi':       {lat:29.7,  lon:113.9},
  'jianye':          {lat:32.0,  lon:118.8},
  'chengdu':         {lat:30.7,  lon:104.1},
  'loc_hanzhong':    {lat:33.1,  lon:107.0},
  'jietin':          {lat:34.7,  lon:105.5},
  'loc_wuzhangyuan': {lat:34.1,  lon:107.9},
  'loc_baidi':       {lat:31.0,  lon:109.5},
  'loc_yiling':      {lat:30.6,  lon:111.3},
  'nanzhong':        {lat:25.0,  lon:103.0},
  'luofengpo':       {lat:31.2,  lon:104.7},
};

// ── Map init ──────────────────────────────────────────────────────────────
function initMap(){
  lmap = L.map('map-wrap',{
    center:[33.0, 112.0], zoom:6,
    minZoom:5, maxZoom:12,
    zoomControl:true, attributionControl:true
  });

  // CartoDB Dark Matter (no API key, dark theme matches the app)
  // 高德地图 - 中文标注，无需 API key
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
    subdomains:['1','2','3','4'],
    attribution:'&copy; <a href="https://www.amap.com">高德地图</a>',
    maxZoom:18
  }).addTo(lmap);

  // Location base markers (subtle green dots)
  RAW.nodes.filter(n=>n.type==='location').forEach(loc=>{
    const c=LOC_COORDS[loc.id]; if(!c) return;
    L.circleMarker([c.lat,c.lon],{
      radius:5, color:'#065f46', fillColor:'#34d399',
      fillOpacity:0.55, weight:1.2
    }).addTo(lmap)
    .bindTooltip(loc.name,{
      permanent:false, className:'map-tip',
      direction:'right', offset:[7,0]
    });
  });

  // Event markers — group by location to apply radial offset for stacked events
  const byLoc={};
  RAW.nodes.filter(n=>n.type==='event'&&n.location_id).forEach(evt=>{
    (byLoc[evt.location_id]=byLoc[evt.location_id]||[]).push(evt);
  });
  Object.values(byLoc).forEach(arr=>
    arr.sort((a,b)=>(EVENT_ORDER[a.id]||99)-(EVENT_ORDER[b.id]||99))
  );

  Object.entries(byLoc).forEach(([lid,evts])=>{
    const c=LOC_COORDS[lid]; if(!c) return;
    const n=evts.length;
    evts.forEach((evt,i)=>{
      let dlat=0, dlon=0;
      if(n>1){
        const r = n<=3?0.10 : n<=6?0.14 : 0.19;
        const angle=(i/n)*2*Math.PI - Math.PI/2;
        dlat=Math.cos(angle)*r;
        dlon=Math.sin(angle)*r / Math.cos(c.lat*Math.PI/180);
      }
      const lat=c.lat+dlat, lon=c.lon+dlon;
      const seq=EVENT_ORDER[evt.id]||99;

      // Outer ring
      const outer=L.circleMarker([lat,lon],{
        radius:12, color:'#fb923c', fill:false,
        weight:2, opacity:0, interactive:true
      }).addTo(lmap);

      // Inner dot (carries the tooltip)
      const inner=L.circleMarker([lat,lon],{
        radius:5, color:'#fb923c', fillColor:'#fb923c',
        fillOpacity:0, weight:0, opacity:0, interactive:true
      }).addTo(lmap)
      .bindTooltip(evt.name + (evt.year ? '　' + evt.year : ''),{
        permanent:false, className:'map-tip',
        direction:'top', offset:[0,-8]
      });

      [outer,inner].forEach(m=>m.on('click',()=>onMapEvt(evt.id)));
      const locName=(nodeMap[lid]||{}).name||'';
      lmarkers[evt.id]={outer, inner, lat, lon, seq, locName};
    });
  });
}

function onMapEvt(evtId){
  const seq=EVENT_ORDER[evtId]||99;
  mapCurrentSeq=seq;
  applySeq(seq, true);
  selectNode(evtId);
}

// ── Timeline ─────────────────────────────────────────────────────────────────
function initTimeline(){
  const bar=document.getElementById('tl-bar');
  const sorted=RAW.nodes
    .filter(n=>n.type==='event')
    .sort((a,b)=>(EVENT_ORDER[a.id]||99)-(EVENT_ORDER[b.id]||99));
  sorted.forEach(e=>tlEvts.push(e));
  const tot=sorted.length;

  sorted.forEach((evt,i)=>{
    const f=(i+0.5)/tot;
    const lc=`calc(${(48-f*96).toFixed(1)}px + ${(f*100).toFixed(3)}%)`;
    const seq=EVENT_ORDER[evt.id]||99;

    const d=document.createElement('div');
    d.className='tl-dot ev-fut'; d.style.left=lc;
    d.style.borderColor='#fb923c66';
    d.dataset.seq=String(seq); d.dataset.id=evt.id;
    d.addEventListener('click',()=>tlClick(evt.id,seq));
    bar.appendChild(d);

    const l=document.createElement('div');
    l.className='tl-lbl ev-fut'; l.style.left=lc;
    l.textContent=evt.name;
    l.dataset.seq=String(seq); l.dataset.id=evt.id;
    l.addEventListener('click',()=>tlClick(evt.id,seq));
    bar.appendChild(l);
  });

  // Year markers
  [184,190,200,208,220,234,249,263].forEach(yr=>{
    let best=0, bd=9999;
    sorted.forEach((e,i)=>{
      const m=(e.year||'').match(/\d+/);
      if(m){const d=Math.abs(parseInt(m[0])-yr);if(d<bd){bd=d;best=i;}}
    });
    const fb=(best+0.5)/tot;
    const ym=document.createElement('div');
    ym.className='tl-yr';
    ym.style.left=`calc(${(48-fb*96).toFixed(1)}px + ${(fb*100).toFixed(3)}%)`;
    ym.textContent=yr+'年';
    bar.appendChild(ym);
  });

  // Rail click
  document.getElementById('tl-rail').addEventListener('click',e=>tlDragMove(e.clientX, true));

  // Thumb drag
  let drag=false;
  const thumb=document.getElementById('tl-thumb');
  thumb.addEventListener('mousedown',e=>{drag=true; e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(drag) tlDragMove(e.clientX, false);});
  document.addEventListener('mouseup',()=>{drag=false;});
  thumb.addEventListener('touchstart',()=>{drag=true;},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(drag) tlDragMove(e.touches[0].clientX, false);
  },{passive:true});
  document.addEventListener('touchend',()=>{drag=false;});
}

function tlDragMove(cx, fly=true){
  const rail=document.getElementById('tl-rail');
  const r=rail.getBoundingClientRect();
  const f=Math.max(0, Math.min(1, (cx-r.left)/r.width));
  const i=Math.min(tlEvts.length-1, Math.floor(f*tlEvts.length));
  const seq=EVENT_ORDER[tlEvts[i].id]||99;
  if(seq!==mapCurrentSeq){
    mapCurrentSeq=seq;
    applySeq(seq, fly);
    selectNode(tlEvts[i].id);
  }
}

function tlClick(evtId, seq){
  mapCurrentSeq=seq;
  applySeq(seq, true);
  selectNode(evtId);
}

// ── Apply sequence state to map + timeline UI ────────────────────────────────
function applySeq(seq, fly=true){
  // Leaflet markers
  if(lmap){
    let flyLat=null, flyLon=null;
    for(const [id, m] of Object.entries(lmarkers)){
      const s=m.seq;
      if(s===seq){
        m.outer.setStyle({color:'#f97316', opacity:1, weight:3});
        m.outer.setRadius(13);
        m.inner.setStyle({fillColor:'#f97316', fillOpacity:1, color:'#f97316', opacity:1});
        m.inner.setRadius(6);
        m.inner.setTooltipContent(m.locName||id);
        m.inner.openTooltip();
        flyLat=m.lat; flyLon=m.lon;
      } else if(s<seq){
        m.outer.setStyle({color:'#475569', opacity:0.45, weight:1.5});
        m.outer.setRadius(9);
        m.inner.setStyle({fillColor:'#475569', fillOpacity:0.5, color:'#475569', opacity:0.5});
        m.inner.setRadius(4.5);
        m.inner.closeTooltip();
      } else {
        m.outer.setStyle({opacity:0});
        m.inner.setStyle({opacity:0, fillOpacity:0});
        m.inner.closeTooltip();
      }
    }
    // Pan so the event is visible in the non-wiki area
    if(fly && flyLat!==null) panToVisible(flyLat, flyLon);
  }

  // Timeline dots + labels
  document.querySelectorAll('.tl-dot, .tl-lbl').forEach(el=>{
    const s=parseInt(el.dataset.seq);
    el.classList.remove('ev-fut','ev-past','ev-cur');
    if(s===seq)      el.classList.add('ev-cur');
    else if(s<seq)   el.classList.add('ev-past');
    else             el.classList.add('ev-fut');
  });

  // Thumb + progress bar
  const tot=tlEvts.length;
  const idx=tlEvts.findIndex(e=>(EVENT_ORDER[e.id]||99)===seq);
  if(idx>=0){
    const rail=document.getElementById('tl-rail');
    const rw=rail.clientWidth||400;
    document.getElementById('tl-thumb').style.left=(48+(idx+0.5)/tot*rw)+'px';
    document.getElementById('tl-prog').style.width=((idx+0.5)/tot*100)+'%';
  }
}

// ── Reset to initial state (no event selected) ───────────────────────────────
function setMapSeq(seq){
  mapCurrentSeq=seq;
  if(seq===-1){
    if(lmap){
      for(const m of Object.values(lmarkers)){
        m.outer.setStyle({opacity:0});
        m.inner.setStyle({opacity:0, fillOpacity:0});
        m.inner.closeTooltip();
      }
    }
    document.querySelectorAll('.tl-dot,.tl-lbl').forEach(el=>{
      el.classList.remove('ev-past','ev-cur');
      el.classList.add('ev-fut');
    });
    document.getElementById('tl-thumb').style.left='48px';
    document.getElementById('tl-prog').style.width='0%';
  } else {
    applySeq(seq, true);
  }
}

// ── Sync sidebar event list clicks → map highlight ───────────────────────────
(function(){
  const _orig=selectNode;
  selectNode=function(id){
    _orig(id);
    if(document.body.classList.contains('map-mode')){
      const n=nodeMap[id];
      if(n && n.type==='event'){
        const seq=EVENT_ORDER[id]||99;
        if(seq!==mapCurrentSeq){ mapCurrentSeq=seq; applySeq(seq, true); }
      }
    }
  };
})();
